/* ============================================================
   HELPERS
   ============================================================ */
const TW = 512, TH = 768;
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapCentered(ctx, text, cx, cy, maxW, lh) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  const startY = cy - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => ctx.fillText(l, cx, startY + i * lh));
}
function drawGoldCorner(ctx, x, y, s, flip = false) {
  ctx.save(); ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.strokeStyle = 'rgba(212,175,90,0.95)'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, s); ctx.lineTo(0, s * 0.30);
  ctx.quadraticCurveTo(0, 0, s * 0.30, 0); ctx.lineTo(s, 0);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(212,175,90,0.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(s * 0.18, s * 0.75); ctx.lineTo(s * 0.18, s * 0.35);
  ctx.quadraticCurveTo(s * 0.18, s * 0.18, s * 0.35, s * 0.18);
  ctx.lineTo(s * 0.75, s * 0.18); ctx.stroke();
  ctx.fillStyle = 'rgba(212,175,90,0.9)';
  ctx.beginPath();
  ctx.moveTo(s * 0.18, s * 0.18 - 6);
  ctx.lineTo(s * 0.18 + 6, s * 0.18);
  ctx.lineTo(s * 0.18, s * 0.18 + 6);
  ctx.lineTo(s * 0.18 - 6, s * 0.18);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawRarityGem(ctx, cx, cy, r, power) {
  ctx.save(); ctx.translate(cx, cy);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.4);
  g.addColorStop(0, 'rgba(212,175,90,0.85)');
  g.addColorStop(1, 'rgba(212,175,90,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 2.4, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(240,220,140,0.95)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(50,80,40,0.85)';
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.7); ctx.lineTo(r * 0.55, 0);
  ctx.lineTo(0, r * 0.7); ctx.lineTo(-r * 0.55, 0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,235,170,0.95)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff8dc';
  ctx.font = `bold ${Math.round(r * 0.95)}px Georgia, serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(212,175,90,0.9)'; ctx.shadowBlur = 8;
  ctx.fillText(String(power), 0, 1); ctx.restore();
}

/* ============================================================
   TEXTURAS DE CARTA
   ============================================================ */
function makeCardTexture(d, index) {
  const cv = document.createElement('canvas');
  cv.width = TW; cv.height = TH;
  const ctx = cv.getContext('2d');
  const bg = ctx.createLinearGradient(0, 0, TW, TH);
  bg.addColorStop(0, d.c1); bg.addColorStop(0.55, d.c2); bg.addColorStop(1, '#05070d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, TW, TH);
  const light = ctx.createRadialGradient(TW*0.5, TH*0.30, 20, TW*0.5, TH*0.42, TH*0.75);
  light.addColorStop(0, 'rgba(255,255,255,0.42)');
  light.addColorStop(0.35, 'rgba(255,255,255,0.12)');
  light.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = light; ctx.fillRect(0, 0, TW, TH);
  ctx.strokeStyle = 'rgba(240,210,140,0.85)'; ctx.lineWidth = 5;
  roundRect(ctx, 22, 22, TW - 44, TH - 44, 30); ctx.stroke();
  const cs = 34;
  drawGoldCorner(ctx, 50, 50, cs, false);
  drawGoldCorner(ctx, TW - 50, 50, cs, true);
  ctx.save(); ctx.translate(50, TH - 50); ctx.rotate(-Math.PI / 2);
  drawGoldCorner(ctx, 0, 0, cs, false); ctx.restore();
  ctx.save(); ctx.translate(TW - 50, TH - 50); ctx.rotate(Math.PI);
  drawGoldCorner(ctx, 0, 0, cs, false); ctx.restore();
  const bY = 60, bH = 92;
  ctx.fillStyle = 'rgba(10,14,24,0.72)';
  roundRect(ctx, 60, bY, TW - 120, bH, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(240,210,140,0.75)'; ctx.lineWidth = 2;
  roundRect(ctx, 60, bY, TW - 120, bH, 14); ctx.stroke();
  ctx.fillStyle = '#f4e9c8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 36px Georgia, serif';
  ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 10;
  ctx.fillText(d.name.toUpperCase(), TW / 2, bY + bH / 2 + 2);
  ctx.shadowBlur = 0;
  const pCX = TW / 2, pCY = TH * 0.52, pR = 140;
  const glass = ctx.createRadialGradient(pCX - 40, pCY - 60, 20, pCX, pCY, pR);
  glass.addColorStop(0, 'rgba(255,255,255,0.42)');
  glass.addColorStop(0.55, 'rgba(255,255,255,0.08)');
  glass.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = glass; ctx.beginPath(); ctx.arc(pCX, pCY, pR, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(240,210,140,0.95)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(pCX, pCY, pR, 0, 7); ctx.stroke();
  ctx.font = '170px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = d.c1; ctx.shadowBlur = 50;
  ctx.fillText(d.emoji, pCX, pCY + 6);
  ctx.shadowBlur = 0;
  const dY = TH - 145, dH = 95;
  ctx.fillStyle = 'rgba(10,14,24,0.78)';
  roundRect(ctx, 60, dY, TW - 120, dH, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(240,210,140,0.7)'; ctx.lineWidth = 2;
  roundRect(ctx, 60, dY, TW - 120, dH, 14); ctx.stroke();
  ctx.fillStyle = 'rgba(255,250,235,0.95)';
  ctx.font = 'italic 22px Georgia, serif';
  wrapCentered(ctx, d.desc, TW / 2, dY + dH * 0.6, TW - 130, 28);
  drawRarityGem(ctx, TW - 76, 76, 26, d.power);
  ctx.fillStyle = 'rgba(240,210,140,0.85)';
  ctx.font = 'bold 20px Georgia, serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('Nº ' + String(index + 1).padStart(2, '0'), 76, 76);
  const vig = ctx.createRadialGradient(TW/2, TH/2, TH*0.35, TW/2, TH/2, TH*0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, TW, TH);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return tex;
}

let _backTexCache = null;
function makeBackTexture() {
  if (_backTexCache) return _backTexCache;
  const cv = document.createElement('canvas');
  cv.width = TW; cv.height = TH;
  const ctx = cv.getContext('2d');
  const bg = ctx.createLinearGradient(0, 0, TW, TH);
  bg.addColorStop(0, '#0d2a20'); bg.addColorStop(0.5, '#041410'); bg.addColorStop(1, '#0d2a20');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, TW, TH);
  for (let i = 0; i < 150; i++) {
    const x = Math.random() * TW, y = Math.random() * TH;
    ctx.fillStyle = `rgba(230,240,210,${Math.random() * 0.5 + 0.15})`;
    ctx.beginPath(); ctx.arc(x, y, Math.random() * 1.4 + 0.2, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(212,175,90,0.75)'; ctx.lineWidth = 4;
  roundRect(ctx, 18, 18, TW - 36, TH - 36, 24); ctx.stroke();
  _backTexCache = new THREE.CanvasTexture(cv);
  _backTexCache.colorSpace = THREE.SRGBColorSpace; _backTexCache.anisotropy = 8;
  return _backTexCache;
}

function makeCoverTexture() {
  const cv = document.createElement('canvas');
  cv.width = TW; cv.height = TH;
  const ctx = cv.getContext('2d');
  const bg = ctx.createLinearGradient(0, 0, TW, TH);
  bg.addColorStop(0, '#0a4535'); bg.addColorStop(0.35, '#052820');
  bg.addColorStop(0.65, '#031a14'); bg.addColorStop(1, '#0a4535');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, TW, TH);
  ctx.strokeStyle = 'rgba(212,175,90,0.95)'; ctx.lineWidth = 7;
  roundRect(ctx, 24, 24, TW - 48, TH - 48, 20); ctx.stroke();
  const cs = 48;
  drawGoldCorner(ctx, 50, 50, cs, false);
  drawGoldCorner(ctx, TW - 50, 50, cs, true);
  ctx.save(); ctx.translate(50, TH - 50); ctx.rotate(-Math.PI / 2);
  drawGoldCorner(ctx, 0, 0, cs, false); ctx.restore();
  ctx.save(); ctx.translate(TW - 50, TH - 50); ctx.rotate(Math.PI);
  drawGoldCorner(ctx, 0, 0, cs, false); ctx.restore();
  ctx.save();
  ctx.shadowColor = 'rgba(255,220,140,0.7)'; ctx.shadowBlur = 25;
  ctx.fillStyle = '#f4e9c8';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'italic bold 70px Georgia, serif';
  ctx.fillText('ILHA', TW / 2, TH * 0.32);
  ctx.font = 'italic bold 50px Georgia, serif';
  ctx.fillText('DA GANÂNCIA', TW / 2, TH * 0.40);
  ctx.restore();
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return tex;
}

function makeInsideCoverTexture() {
  const cv = document.createElement('canvas');
  cv.width = TW; cv.height = TH;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, TW, TH);
  g.addColorStop(0, '#f6ecd6'); g.addColorStop(1, '#e2d0a8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, TW, TH);
  ctx.fillStyle = '#5c4527';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'italic bold 36px Georgia, serif';
  ctx.fillText('Bem-vindo,', TW / 2, 200);
  ctx.font = 'italic bold 48px Georgia, serif';
  ctx.fillText('caçador', TW / 2, 260);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return tex;
}

function makeBackCoverInsideTexture() {
  const cv = document.createElement('canvas');
  cv.width = TW; cv.height = TH;
  const ctx = cv.getContext('2d');

function makeSkyDomeTexture() {
  const W = 2048, H = 1024;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#02040c'); g.addColorStop(0.50, '#000000'); g.addColorStop(1.00, '#02040c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5000; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    const r = Math.random() < 0.85 ? Math.random() * 0.6 + 0.15 : Math.random() * 1.2 + 0.4;
    const b = 0.15 + Math.random() * 0.5;
    const hue = Math.random() < 0.15 ? 30 + Math.random() * 30
              : Math.random() < 0.30 ? 200 + Math.random() * 60 : 210 + Math.random() * 30;
    ctx.fillStyle = `hsla(${hue}, 40%, ${80 + Math.random() * 15}%, ${b})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  for (let i = 0; i < 350; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    const r = 1 + Math.random() * 1.2;
    const b = 0.5 + Math.random() * 0.4;
    const hue = Math.random() < 0.20 ? 30 : 200 + Math.random() * 50;
    const halo = ctx.createRadialGradient(x, y, 0, x, y, r * 6);
    halo.addColorStop(0, `hsla(${hue}, 60%, 90%, ${b * 0.5})`);
    halo.addColorStop(1, 'transparent');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(x, y, r * 6, 0, 7); ctx.fill();
    ctx.fillStyle = `hsla(${hue}, 70%, 95%, ${b})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  return tex;
}

function makeNebulaTex(hue, seed) {
  const S = 384;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const ctx = cv.getContext('2d');
  const rnd = (n) => { const x = Math.sin((seed + 1) * n * 12.9898) * 43758.5453; return x - Math.floor(x); };
  ctx.globalCompositeOperation = 'lighter';
  const core = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S * 0.35);
  core.addColorStop(0, `hsla(${hue}, 90%, 82%, 0.65)`);
  core.addColorStop(0.4, `hsla(${hue}, 85%, 65%, 0.25)`);
  core.addColorStop(1, 'transparent');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(S/2, S/2, S * 0.35, 0, 7); ctx.fill();
  for (let i = 0; i < 12; i++) {
    const x = S/2 + (rnd(i + 1) - 0.5) * S * 0.9;
    const y = S/2 + (rnd(i + 20) - 0.5) * S * 0.9;
    const r = 30 + rnd(i + 40) * 90;
    const h = hue + (rnd(i + 60) - 0.5) * 50;
    const b = ctx.createRadialGradient(x, y, 0, x, y, r);
    b.addColorStop(0, `hsla(${h}, 80%, 65%, ${0.10 + rnd(i + 80) * 0.12})`);
    b.addColorStop(1, 'transparent');
    ctx.fillStyle = b;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  for (let i = 0; i < 80; i++) {
    const x = rnd(i * 2 + 100) * S, y = rnd(i * 2 + 200) * S;
    const r = 0.3 + rnd(i * 3 + 300) * 0.9;
    ctx.fillStyle = `rgba(255,255,255,${0.15 + rnd(i + 400) * 0.6})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  return tex;
}

const starLayers = [];
function makeStarLayer(count, size, hueRange, distance, opacity) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const u = Math.random(), v = Math.random();
    const theta = 2 * Math.PI * u;
    const phi = Math.acos(2 * v - 1);
    const r = distance * (0.95 + Math.random() * 0.05);
    pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3 + 1] = r * Math.cos(phi);
    pos[i*3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    const hue = hueRange[0] + Math.random() * (hueRange[1] - hueRange[0]);
    c.setHSL(hue / 360, 0.5 + Math.random() * 0.4, 0.85 + Math.random() * 0.15);
    colors[i*3] = c.r; colors[i*3 + 1] = c.g; colors[i*3 + 2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size, sizeAttenuation: false, map: STAR_POINT_TEX,
    vertexColors: true, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, fog: false
  });
  const points = new THREE.Points(geo, mat);
  points.renderOrder = -999;
  points.userData.baseOpacity = opacity;
  points.userData.pulseSpeed = 0.3 + Math.random() * 0.4;
  points.userData.pulsePhase = Math.random() * Math.PI * 2;
  return points;
}

function buildConstellation(name, animal, pts, scale, color, intensity, isZodiac) {
  const group = new THREE.Group();
  const id = makeUniqueId(name);
  group.userData.constellationId = id;
  group.userData.constellationName = name;
  group.userData.animal = animal;

  const center = pts.reduce((a, p) => [a[0] + p[0], a[1] + p[1]], [0,0]);
  center[0] /= pts.length; center[1] /= pts.length;
  const localPts = pts.map(p => [(p[0] - center[0]) * 6 * scale, (p[1] - center[1]) * 6 * scale]);
  const lineMat = new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 0.45 * intensity,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, fog: false
  });
  const lineGeo = new THREE.BufferGeometry().setFromPoints(localPts.map(p => new THREE.Vector3(p[0], p[1], 0)));
  const line = new THREE.Line(lineGeo, lineMat);
  group.add(line);
  group.userData.lineMat = lineMat;
  group.userData.baseLineOpacity = 0.45 * intensity;
  group.userData.phase = Math.random() * Math.PI * 2;

  // Estrelas
  const starSprites = [];
  localPts.forEach(p => {
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: STAR_POINT_TEX, color, transparent: true,
      opacity: 0.55 * intensity, blending: THREE.AdditiveBlending,
      depthWrite: false, depthTest: false, fog: false
    }));
    halo.scale.set(7, 7, 1);
    halo.position.set(p[0], p[1], -0.08);
    halo.userData.baseScale = 7;
    halo.userData.baseOpacity = 0.55 * intensity;
    halo.userData.pulseSpeed = 0.6 + Math.random() * 0.8;
    halo.userData.pulsePhase = Math.random() * Math.PI * 2;
    allPulsingStars.push(halo);
    group.add(halo);
    starSprites.push(halo);

    const core = new THREE.Sprite(new THREE.SpriteMaterial({
      map: STAR_POINT_TEX, color: isZodiac ? 0xfff5d0 : color, transparent: true,
      opacity: 0.98 * intensity, blending: THREE.AdditiveBlending,
      depthWrite: false, depthTest: false, fog: false
    }));
    const cs = isZodiac ? 3.5 : 2.2;
    core.scale.set(cs, cs, 1);
    core.position.set(p[0], p[1], 0);
    core.userData.baseScale = cs;
    core.userData.baseOpacity = 0.98 * intensity;
    core.userData.pulseSpeed = 1.0 + Math.random() * 1.0;
    core.userData.pulsePhase = Math.random() * Math.PI * 2 + 2.7;
    allPulsingStars.push(core);
    group.add(core);
    starSprites.push(core);
  });

  // ★ Animal sprite (invisível até ser apontado) ★
  const animalTex = getAnimalTex(animal, '#' + new THREE.Color(color).getHexString());
  const animalSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: animalTex, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, fog: false
  }));
  animalSprite.scale.set(0.001, 0.001, 1);
  animalSprite.position.set(0, 0, 0.5);
  group.add(animalSprite);
  group.userData.animalSprite = animalSprite;

  // ★ Contorno brilhante (anel pontilhado) ★
  const outlinePts = localPts.map(p => new THREE.Vector3(p[0], p[1], 0.2));
  // Fecha o polígono
  if (outlinePts.length > 1) outlinePts.push(outlinePts[0].clone());
  const outlineGeo = new THREE.BufferGeometry().setFromPoints(outlinePts);
  const outlineMat = new THREE.LineBasicMaterial({
    color: isZodiac ? 0xfff5d0 : color,
    transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
    linewidth: 2
  });
  const outlineLine = new THREE.Line(outlineGeo, outlineMat);
  group.add(outlineLine);
  group.userData.outlineLine = outlineLine;
  group.userData.outlineMat = outlineMat;

  // ★ Halo circular grande ao redor da constelação ★
  const haloCircle = new THREE.Mesh(
    new THREE.RingGeometry(scale * 7, scale * 8, 48),
    new THREE.MeshBasicMaterial({
      color: isZodiac ? 0xfff5d0 : color,
      transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      depthWrite: false, depthTest: false, fog: false
    })
  );
  group.add(haloCircle);
  group.userData.haloCircle = haloCircle;

  group.userData.isHighlighted = false;
  group.userData.highlightIntensity = 0;

  return group;
}
function placeConstellation(group, azimuth, elevation, dist = SKY_RADIUS * 0.72) {
  group.position.set(
    dist * Math.cos(elevation) * Math.cos(azimuth),
    dist * Math.sin(elevation),
    dist * Math.cos(elevation) * Math.sin(azimuth)
  );
  group.lookAt(0, 0, 0);
}

const SHOOTING_TRAIL_TEX = (() => {
  const W = 256, H = 32;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(0.75, 'rgba(230,245,255,0.75)');
  g.addColorStop(1, 'rgba(255,255,255,1)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const vg = ctx.createLinearGradient(0, 0, 0, H);
  vg.addColorStop(0, 'rgba(0,0,0,1)');
  vg.addColorStop(0.5, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  return tex;
})();
const TRAIL_GEO = new THREE.PlaneGeometry(1, 4);

function spawnShootingStar() {
  const color = SHOOTING_COLORS[Math.floor(Math.random() * SHOOTING_COLORS.length)];
  const startAz = Math.random() * Math.PI * 2;
  const startEl = 0.5 + Math.random() * 0.5;
  const dirAz = startAz + (Math.random() - 0.5) * 1.0;
  const dirEl = startEl - 0.4 - Math.random() * 0.4;
  const dist = SKY_RADIUS * 0.85;
  const startPos = new THREE.Vector3(
    dist * Math.cos(startEl) * Math.cos(startAz),
    dist * Math.sin(startEl),
    dist * Math.cos(startEl) * Math.sin(startAz)
  );
  const endPos = new THREE.Vector3(
    dist * Math.cos(dirEl) * Math.cos(dirAz),
    dist * Math.sin(dirEl),
    dist * Math.cos(dirEl) * Math.sin(dirAz)
  );
  const tailDir = new THREE.Vector3().subVectors(endPos, startPos).normalize();
  const head = new THREE.Sprite(new THREE.SpriteMaterial({
    color, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, fog: false,
    map: STAR_POINT_TEX
  }));
  head.scale.set(14, 14, 1);
  const trailLen = 40 + Math.random() * 40;
  const trailMat = new THREE.MeshBasicMaterial({
    map: SHOOTING_TRAIL_TEX, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
    side: THREE.DoubleSide, color, fog: false
  });
  const trailMesh = new THREE.Mesh(TRAIL_GEO, trailMat);
  trailMesh.scale.set(trailLen, 1, 1);
  trailMesh.position.set(-trailLen / 2, 0, 0);
  const group = new THREE.Group();
  group.add(head);
  group.add(trailMesh);
  scene.add(group);
  shootingStars.push({
    group, head, trailMat, startPos, endPos, tailDir,
    t: 0, life: 1.6 + Math.random() * 1.2
  });
}

function createSheet(yPos, frontCards, backCards, startIdxFront, startIdxBack) {
  const pivot = new THREE.Group();
  pivot.position.set(0, yPos, 0);
  bookGroup.add(pivot);
  const paperMat = new THREE.MeshStandardMaterial({ color: 0xf7f0dd, roughness: 0.92 });
  const edgeMat = new THREE.MeshStandardMaterial({ color: 0xe9dcc0, roughness: 0.88 });
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(PW, SHEET_T, PD),
    [edgeMat, edgeMat, paperMat, paperMat, edgeMat, edgeMat]
  );
  mesh.position.set(PW / 2, 0, 0);
  mesh.castShadow = true; mesh.receiveShadow = true;
  pivot.add(mesh);

  const cols = [-1.7, 0, 1.7], rows = [-1.6, 1.6];
  const positions = [];
  for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) positions.push({ x: cols[c], z: rows[r] });

  if (frontCards) frontCards.forEach((d, i) => {
    const globalIdx = startIdxFront + i;
    const card = createCard(d, globalIdx);
    card.position.set(positions[i].x, SHEET_T / 2 + CARD_T / 2, positions[i].z);
    mesh.add(card);
    const slot = createSlot(globalIdx);
    slot.rotation.set(-Math.PI / 2, 0, 0);
    slot.position.set(positions[i].x, SHEET_T / 2 + 0.012, positions[i].z);
    slot.visible = false;
    mesh.add(slot);
    card.userData.slot = slot;
  });
  if (backCards) backCards.forEach((d, i) => {
    const globalIdx = startIdxBack + i;
    const card = createCard(d, globalIdx);
    card.position.set(positions[i].x, -SHEET_T / 2 - CARD_T / 2, positions[i].z);
    card.rotation.z = Math.PI;
    mesh.add(card);
    const slot = createSlot(globalIdx);
    slot.rotation.set(Math.PI / 2, 0, Math.PI);
    slot.position.set(positions[i].x, -SHEET_T / 2 - 0.012, positions[i].z);
    slot.visible = false;
    mesh.add(slot);
    card.userData.slot = slot;
  });
  return { pivot, mesh };
}

const activeTweens = [];
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function animate(duration, updateFn, completeFn, ease = easeInOutCubic) {
  const t0 = performance.now();
  const tw = {
    update(now) {
      const p = Math.min(1, (now - t0) / duration);
      updateFn(ease(p), p);
      return p < 1;
    },
    complete: completeFn
  };
  activeTweens.push(tw);
  return tw;
}
function updateTweens(now) {
  for (let i = activeTweens.length - 1; i >= 0; i--) {
    const done = !activeTweens[i].update(now);
    if (done) {
      const cb = activeTweens[i].complete;
      activeTweens.splice(i, 1);
      if (cb) cb();
    }
  }
}

function updateBookVRTransform(dt) {

function openAlbum() {
  if (state.mode !== 'closed') return;
  state.mode = 'flipping'; state.spread = 1; refreshUI();
  const sR = coverInfo.pivot.rotation.z, sY = coverInfo.pivot.position.y;
  const camStart = camera.position.clone();
  const tgtStart = controls.target.clone();
  const inVR = isVRActive();
  animate(1200, (t) => {
    coverInfo.pivot.rotation.z = sR + (Math.PI - sR) * t;
    coverInfo.pivot.position.y = sY + (coverInfo.flippedY - sY) * t;
    if (!inVR) {
      camera.position.lerpVectors(camStart, CAM_OPEN, t);
      controls.target.lerpVectors(tgtStart, TARGET_OPEN, t);
    }
  }, () => { state.mode = 'open'; refreshUI(); });
}
function closeAlbum() {
  if (state.mode !== 'open') return;
  if (state.spread > 1) { flipBack(() => closeAlbum()); return; }
  state.mode = 'flipping'; refreshUI();
  const sR = coverInfo.pivot.rotation.z, sY = coverInfo.pivot.position.y;
  const camStart = camera.position.clone();
  const tgtStart = controls.target.clone();
  const inVR = isVRActive();
  animate(1200, (t) => {

    if (!inVR) {
      camera.position.lerpVectors(camStart, CAM_CLOSED, t);

  }, () => { state.mode = 'closed'; state.spread = 0; refreshUI(); });
}
function flipForward() {
  if (state.mode !== 'open' || state.spread >= MAX_SPREAD) return;
  state.mode = 'flipping'; refreshUI();
  const target = state.spread === 1 ? sheet1 : state.spread === 2 ? sheet2 : null;
  if (!target) return;
  const sR = target.pivot.rotation.z, sY = target.pivot.position.y;
  animate(950, (t) => {
    target.pivot.rotation.z = sR + (Math.PI - sR) * t;
    target.pivot.position.y = sY + (target.flippedY - sY) * t;
    target.pivot.position.y += Math.sin(t * Math.PI) * 0.06;
  }, () => {
    target.pivot.rotation.z = Math.PI;
    target.pivot.position.y = target.flippedY;
    state.spread++; state.mode = 'open'; refreshUI();
  });
}
function flipBack(callback) {
  if (state.mode !== 'open' || state.spread <= 1) { if (callback) callback(); return; }
  state.mode = 'flipping'; refreshUI();
  const target = state.spread === 2 ? sheet1 : state.spread === 3 ? sheet2 : null;
  if (!target) { state.mode = 'open'; refreshUI(); return; }
  const sR = target.pivot.rotation.z, sY = target.pivot.position.y;
  animate(950, (t) => {
    target.pivot.rotation.z = sR * (1 - t);
    target.pivot.position.y = sY + (target.originalY - sY) * t;
    target.pivot.position.y += Math.sin(t * Math.PI) * 0.06;
  }, () => {
    target.pivot.rotation.z = 0;
    target.pivot.position.y = target.originalY;
    state.spread--; state.mode = 'open'; refreshUI();
    if (callback) callback();
  });
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
function setPointer(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}
function pickCard() {
  raycaster.setFromCamera(pointer, camera);
  const allCards = [];
  bookGroup.traverse(o => { if (o.userData.isCard) allCards.push(o); });
  const hits = raycaster.intersectObjects(allCards, false);
  return hits.length ? hits[0].object : null;
}
function pickCover() {
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObject(coverOutsidePlane, false).length > 0;
}
function computeCardFacingQuat(cardPos, camPos) {
  const yDir = new THREE.Vector3().subVectors(camPos, cardPos).normalize();
  const worldDown = new THREE.Vector3(0, -1, 0);
  const zDir = worldDown.clone().projectOnPlane(yDir).normalize();
  const xDir = new THREE.Vector3().crossVectors(yDir, zDir).normalize();
  return new THREE.Quaternion().setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(xDir, yDir, zDir)
  );
}
function computeTerrainQuat(cardPos, camPos) {
  const toCam = new THREE.Vector3().subVectors(camPos, cardPos).normalize();
  const horiz = new THREE.Vector3(toCam.x, 0, toCam.z).normalize();
  const yaw = Math.atan2(horiz.x, horiz.z);
  const tiltQuat = new THREE.Quaternion().setFromEuler(
    new THREE.Euler(-Math.PI / 2 + 0.55, 0, 0, 'YXZ')
  );
  const yawQuat = new THREE.Quaternion().setFromEuler(
    new THREE.Euler(0, yaw + Math.PI, 0, 'YXZ')
  );
  return yawQuat.multiply(tiltQuat);
}

function summonHologram(card) {

function desummonHologram(onComplete) {
  if (state.inspectedCard && state.inspectedCard.userData.terrainOverlay) {
    const overlay = state.inspectedCard.userData.terrainOverlay;
    animate(500, (t) => { TERRAIN_MAT.opacity = 0.85 * (1 - t); },

  }
  state.isAttacking = false;

  const bc = 40;

  const pos = new Float32Array(bc * 3);

  const c = new THREE.Color(0x88ddff);
  for (let i = 0; i < bc; i++) {
    pos[i*3] = holo.position.x;
    pos[i*3+1] = holo.position.y + 1.7;
    pos[i*3+2] = holo.position.z;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const s = 1.0 + Math.random() * 2.5;
    vel.push({
      x: Math.sin(phi) * Math.cos(theta) * s,
      y: Math.cos(phi) * s + 0.6,
      z: Math.sin(phi) * Math.sin(theta) * s
    });
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  bGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  bGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const bMat = new THREE.PointsMaterial({
    size: 0.15, vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, map: STAR_POINT_TEX
  });
  const burst = new THREE.Points(bGeo, bMat);
  scene.add(burst);
  const sScale = holo.scale.x;
  animate(500, (t) => {
    holo.scale.setScalar(sScale * (1 - t));
    const p = burst.geometry.attributes.position.array;
    for (let i = 0; i < bc; i++) {
      p[i*3] += vel[i].x * 0.016;
      p[i*3+1] += vel[i].y * 0.016;
      p[i*3+2] += vel[i].z * 0.016;
      vel[i].y -= 0.04;
    }
    burst.geometry.attributes.position.needsUpdate = true;
    bMat.opacity = 1 - t;
  }, () => {
    scene.remove(holo);
    holo.traverse(o => {
      if (o.geometry && o.geometry !== CARD_BOX_GEO && o.geometry !== SLOT_PLANE_GEO
          && o.geometry !== TERRAIN_PLANE_GEO && o.geometry !== TRAIL_GEO) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => {
          if (m !== CARD_EDGE_MAT && m !== CARD_BACK_MAT) m.dispose();
        });
        else if (o.material !== CARD_EDGE_MAT && o.material !== CARD_BACK_MAT) o.material.dispose();
      }
    });
    animate(400, (t) => {
      bMat.opacity = 1 - t;
      bMat.size = 0.15 * (1 + t * 2);
    }, () => {
      scene.remove(burst);
      bGeo.dispose(); bMat.dispose();
      if (onComplete) onComplete();
    });
  });
}

function triggerAttack() {

    const spread = 0.7;
    const dir = attackDir.clone()
      .add(new THREE.Vector3((Math.random() - 0.5) * spread, (Math.random() - 0.3) * spread, (Math.random() - 0.5) * spread))
      .normalize();
    pVel.push(dir.multiplyScalar(2 + Math.random() * 3.5));
    pCol[i*3] = color.r; pCol[i*3+1] = color.g; pCol[i*3+2] = color.b;
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
  const pMat = new THREE.PointsMaterial({
    size: 0.14, vertexColors: true, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false, map: STAR_POINT_TEX
  });
  const particles = new THREE.Points(pGeo, pMat);
  scene.add(particles);
  animate(1100, (t) => {
    const arr = pGeo.attributes.position.array;
    for (let i = 0; i < pCount; i++) {
      arr[i*3] += pVel[i].x * 0.016;
      arr[i*3+1] += pVel[i].y * 0.016;
      arr[i*3+2] += pVel[i].z * 0.016;
      pVel[i].y -= 0.05;
    }
    pGeo.attributes.position.needsUpdate = true;
    pMat.opacity = 1 - t * 0.9;
  }, () => {
    scene.remove(particles); pGeo.dispose(); pMat.dispose();
  }, easeOutCubic);

  const holoStartPos = holo.position.clone();
  animate(900, (t) => {
    let push = 0;
    if (t < 0.25) push = -0.10 * (t / 0.25);
    else if (t < 0.55) push = -0.10 + 0.55 * ((t - 0.25) / 0.30);
    else push = 0.45 * (1 - (t - 0.55) / 0.45);
    holo.position.copy(holoStartPos).addScaledVector(attackDir, push);
  }, () => { state.isAttacking = false; }, (t) => t);

  if (state.cardLayout !== 'terrain') toggleCardTerrain();
}

function toggleCardTerrain() {
  if (!state.inspectedCard || !state.summoned) return;
  if (state.cardLayout === 'face') state.cardLayout = 'terrain';
  else { state.cardLayout = 'face'; cardWasManuallyPlaced = false; }
  updateCardTargets(true);
  refreshUI();
}
function updateCardTargets(animated = false) {
  if (!state.inspectedCard) return;
  const camPos = new THREE.Vector3();
  camera.getWorldPosition(camPos);
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  const inVR = isVRActive();
  const dist = inVR ? 0.50 : 6.8;
  const newTargetPos = camPos.clone().addScaledVector(camDir, dist);
  const newTargetQuat = state.cardLayout === 'terrain'
    ? computeTerrainQuat(newTargetPos, camPos)
    : computeCardFacingQuat(newTargetPos, camPos);
  if (animated) {
    const startPos = state.inspectedCard.position.clone();
    const startQuat = state.inspectedCard.quaternion.clone();
    animate(700, (t) => {
      state.inspectedCard.position.lerpVectors(startPos, newTargetPos, t);
      state.inspectedCard.quaternion.slerpQuaternions(startQuat, newTargetQuat, t);
    }, () => {
      cardTargetPos.copy(newTargetPos);
      cardTargetQuat.copy(newTargetQuat);
    });
  } else {
    cardTargetPos.copy(newTargetPos);
    cardTargetQuat.copy(newTargetQuat);
  }
}

function inspectCard(card) {
  if (state.summoned) { desummonHologram(() => doInspect(card)); return; }
  doInspect(card);
}
function doInspect(card) {
  state.mode = 'inspecting';
  state.inspectedCard = card;
  state.cardLayout = 'face';
  cardWasManuallyPlaced = false;
  state.cardOriginalParent = card.parent;
  state.cardOriginalPos = card.position.clone();
  state.cardOriginalQuat = card.quaternion.clone();
  state.cardOriginalScale = card.scale.clone();
  if (card.userData.slot) card.userData.slot.visible = true;
  scene.attach(card);
  const camPos = new THREE.Vector3();
  camera.getWorldPosition(camPos);
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  const inVR = isVRActive();
  const dist = inVR ? 0.50 : 6.8;
  const targetPos = camPos.clone().addScaledVector(camDir, dist);
  const targetQuat = computeCardFacingQuat(targetPos, camPos);
  const startPos = card.position.clone();
  const startQuat = card.quaternion.clone();
  const startScale = card.scale.clone();
  const targetScale = inVR
    ? new THREE.Vector3(0.18, 0.18, 0.18)
    : new THREE.Vector3(1.3, 1.3, 1.3);
  controls.enabled = false;
  refreshUI();
  animate(600, (t) => {
    card.position.lerpVectors(startPos, targetPos, t);
    card.quaternion.slerpQuaternions(startQuat, targetQuat, t);
    card.scale.lerpVectors(startScale, targetScale, t);
  }, () => {
    card.position.copy(targetPos);
    card.quaternion.copy(targetQuat);
    card.scale.copy(targetScale);
    cardTargetPos.copy(targetPos);
    cardTargetQuat.copy(targetQuat);
    summonHologram(card);
    refreshUI();
  }, easeOutCubic);
}
function returnInspectedCard() {
  if (!state.inspectedCard) return;
  const card = state.inspectedCard;
  endCardGrab();
  state.cardLayout = 'face';
  cardWasManuallyPlaced = false;
  if (state.summoned) desummonHologram(() => returnCardToAlbum(card));
  else returnCardToAlbum(card);
}
function returnCardToAlbum(card) {
  const parent = state.cardOriginalParent;
  parent.updateWorldMatrix(true, false);
  const targetWorldPos = state.cardOriginalPos.clone().applyMatrix4(parent.matrixWorld);
  const parentWorldQuat = new THREE.Quaternion();
  parent.getWorldQuaternion(parentWorldQuat);
  const targetWorldQuat = parentWorldQuat.clone().multiply(state.cardOriginalQuat);
  const startPos = card.position.clone();
  const startQuat = card.quaternion.clone();
  const startScale = card.scale.clone();
  const targetScale = state.cardOriginalScale.clone();
  state.mode = 'flipping';
  state.inspectedCard = null;
  refreshUI();
  animate(550, (t) => {
    card.position.lerpVectors(startPos, targetWorldPos, t);
    card.quaternion.slerpQuaternions(startQuat, targetWorldQuat, t);
    card.scale.lerpVectors(startScale, targetScale, t);
  }, () => {
    parent.add(card);
    card.position.copy(state.cardOriginalPos);
    card.quaternion.copy(state.cardOriginalQuat);
    card.scale.copy(state.cardOriginalScale);
    if (card.userData.slot) card.userData.slot.visible = false;
    if (card.userData.terrainOverlay) {
      card.userData.terrainOverlay.visible = false;
      TERRAIN_MAT.opacity = 0;
    }
    state.mode = 'open';
    controls.enabled = true;
    refreshUI();
  });
}

let pointerDownOnCard = false;
let pointerDownScreen = new THREE.Vector2();
let pointerDownTime = 0;
let didDrag = false;
const DRAG_THRESHOLD_PX = 6;
const cardDragStartQuat = new THREE.Quaternion();
function startCardDrag(e, card) {
  pointerDownOnCard = true;
  pointerDownScreen.set(e.clientX, e.clientY);
  pointerDownTime = performance.now();
  didDrag = false;
  cardDragStartQuat.copy(card.quaternion);
}
function updateCardDrag(e) {
  if (!pointerDownOnCard || !state.inspectedCard) return;
  const dx = e.clientX - pointerDownScreen.x;
  const dy = e.clientY - pointerDownScreen.y;
  if (!didDrag && dx*dx + dy*dy > DRAG_THRESHOLD_PX * DRAG_THRESHOLD_PX) {
    didDrag = true;
    renderer.domElement.style.cursor = 'grabbing';
  }
  if (!didDrag) return;
  const eul = new THREE.Euler(dy * 0.01, dx * 0.01, 0, 'YXZ');
  const delta = new THREE.Quaternion().setFromEuler(eul);
  state.inspectedCard.quaternion.copy(cardDragStartQuat).multiply(delta);
  cardTargetQuat.copy(state.inspectedCard.quaternion);
}
function endCardDrag() {
  if (!pointerDownOnCard) return;
  const wasClick = !didDrag && (performance.now() - pointerDownTime) < 500;
  pointerDownOnCard = false;
  if (wasClick && state.inspectedCard) { returnInspectedCard(); return; }
  if (didDrag) renderer.domElement.style.cursor = 'pointer';
}
function onPointerDown(e) {
  if (e.button !== 0 || renderer.xr.isPresenting) return;
  setPointer(e);
  if (state.mode === 'closed') { if (pickCover()) openAlbum(); return; }
  if (state.mode === 'open') {
    const card = pickCard();
    if (card) inspectCard(card);
    return;
  }
  if (state.mode === 'inspecting') {
    raycaster.setFromCamera(pointer, camera);
    if (raycaster.intersectObject(state.inspectedCard, false).length > 0) {
      startCardDrag(e, state.inspectedCard);
    } else returnInspectedCard();
  }
}
function onPointerMove(e) {
  if (renderer.xr.isPresenting) return;
  if (state.mode === 'inspecting' && pointerDownOnCard) { updateCardDrag(e); return; }
  if (state.mode === 'closed') {
    setPointer(e);
    renderer.domElement.style.cursor = pickCover() ? 'pointer' : 'grab';
  } else if (state.mode === 'open') {
    setPointer(e);
    renderer.domElement.style.cursor = pickCard() ? 'pointer' : 'grab';
  } else if (state.mode === 'inspecting') {
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    renderer.domElement.style.cursor =
      raycaster.intersectObject(state.inspectedCard, false).length > 0 ? 'grab' : 'default';
  }
}
renderer.domElement.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', endCardDrag);
window.addEventListener('pointercancel', endCardDrag);
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.mode === 'inspecting') returnInspectedCard();
    else if (state.mode === 'open') closeAlbum();
  }
  if (e.key === 'ArrowRight' && state.mode === 'open') flipForward();
  if (e.key === 'ArrowLeft' && state.mode === 'open') flipBack();
  if ((e.key === 'd' || e.key === 'D') && state.summoned) desummonHologram();

  if ((e.key === 'm' || e.key === 'M') && isVRActive()) resetBookPosition();
});

let speechRecognition = null;
let voiceActive = false;
let voiceInitAttempts = 0;

async function initVoiceRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    console.warn('❌ SpeechRecognition não suportado neste navegador');
    voiceStatusEl.innerHTML = '⚠️ Voz não suportada';
    return false;
  }

  // Verifica se getUserMedia está disponível
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    console.warn('❌ getUserMedia não disponível');
    return false;
  }

  try {
    console.log('🎤 Solicitando permissão de microfone...');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // Para as tracks de áudio (não precisamos manter o stream)
    stream.getTracks().forEach(t => t.stop());
    console.log('✅ Permissão de microfone concedida');
  } catch (e) {
    console.warn('❌ Permissão de microfone negada:', e);
    voiceStatusEl.innerHTML = '⚠️ Microfone bloqueado';
    return false;
  }

  try {
    speechRecognition = new SR();
    speechRecognition.continuous = true;
    speechRecognition.interimResults = true;
    speechRecognition.maxAlternatives = 1;

    // Tenta pt-BR primeiro, com fallback
    speechRecognition.lang = 'pt-BR';

    speechRecognition.onstart = () => {
      console.log('🎤 Reconhecimento iniciado');
      voiceStatusEl.classList.add('listening');
      voiceStatusEl.innerHTML = '<span class="dot"></span>🎤 Ouvindo: diga "livro"';
      voiceBtn.classList.add('active');
    };

    speechRecognition.onresult = (event) => {
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript.toLowerCase().trim();
        console.log('🎤 Ouvido:', transcript);
        if (transcript.includes('livro') ||
            transcript.includes('álbum') ||
            transcript.includes('album') ||
            transcript.includes('abrir') ||
            transcript.includes('abre')) {
          console.log('✅ COMANDO "LIVRO" RECONHECIDO!');
          showAlbumInFront();
          voiceStatusEl.innerHTML = '<span class="dot"></span>✅ Álbum invocado!';
          setTimeout(() => {
            if (voiceActive) {
              voiceStatusEl.innerHTML = '<span class="dot"></span>🎤 Ouvindo: diga "livro"';
            }
          }, 2000);
        }
      }
    };

    speechRecognition.onerror = (e) => {
      console.warn('❌ Erro de voz:', e.error);
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        voiceStatusEl.innerHTML = '⚠️ Microfone bloqueado';
        voiceActive = false;
        voiceBtn.classList.remove('active');
      } else if (e.error === 'audio-capture') {
        voiceStatusEl.innerHTML = '⚠️ Sem microfone';
      }
      // Erros temporários: reinicia
      if (e.error === 'network' || e.error === 'aborted' || e.error === 'no-speech') {
        setTimeout(() => {
          if (voiceActive) {
            try { speechRecognition.start(); } catch (err) {}
          }
        }, 500);
      }
    };

    speechRecognition.onend = () => {
      console.log('🔇 Reconhecimento terminou');
      if (voiceActive) {
        // Reinicia automaticamente
        setTimeout(() => {
          try {
            speechRecognition.start();
            console.log('🔄 Reiniciando reconhecimento...');
          } catch (e) {
            console.warn('Falha ao reiniciar:', e);
          }
        }, 300);
      } else {
        voiceStatusEl.classList.remove('listening');
        voiceBtn.classList.remove('active');
      }
    };

    return true;
  } catch (e) {
    console.warn('❌ Erro ao criar reconhecimento:', e);
    return false;
  }
}

async function startVoice() {
  if (voiceActive) return;
  voiceInitAttempts++;
  if (!speechRecognition) {
    const ok = await initVoiceRecognition();
    if (!ok) return;
  }
  try {
    speechRecognition.start();
    voiceActive = true;
    voiceStatusEl.classList.add('listening');
    voiceBtn.classList.add('active');
    console.log('🎤 Voz ATIVA');
  } catch (e) {
    console.warn('Erro ao iniciar voz:', e);
    // Se já estiver rodando, ignora
    if (e.name !== 'InvalidStateError') {
      voiceActive = false;
      voiceBtn.classList.remove('active');
    }
  }
}

function stopVoice() {
  voiceActive = false;
  if (speechRecognition) {
    try { speechRecognition.stop(); } catch (e) {}
  }
  voiceStatusEl.classList.remove('listening');
  voiceBtn.classList.remove('active');
  console.log('🔇 Voz desativada');
}

// Botão de voz
voiceBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (voiceActive) {
    stopVoice();
  } else {
    startVoice();
  }
});

// Inicia voz no primeiro clique do usuário
let voiceFirstClickDone = false;
document.body.addEventListener('click', () => {
  if (!voiceFirstClickDone && !voiceActive) {
    voiceFirstClickDone = true;
    setTimeout(startVoice, 200);
  }
});

// Também tenta iniciar no carregamento (funciona se já houver permissão)
window.addEventListener('load', () => {
  setTimeout(() => {
    // Tenta iniciar silenciosamente
    if (!voiceActive) startVoice();
  }, 1500);
});

   ============================================================ */
const _cameraDir = new THREE.Vector3();
const _toConstDir = new THREE.Vector3();
const _constPos = new THREE.Vector3();
let currentPointedConstellation = null;
let constellationDisplayTimeout = null;
const POINT_ANGLE_THRESHOLD = 0.85; // ~30 graus de tolerância
const HIGHLIGHT_FADE_SPEED = 3.0;

function updateConstellationPointing(dt, time) {
  // Pega direção da câmera (ou do controlador em VR)
  camera.getWorldDirection(_cameraDir);
  const camPos = new THREE.Vector3();
  camera.getWorldPosition(camPos);

  let bestConstellation = null;
  let bestDot = POINT_ANGLE_THRESHOLD;

  // Checa cada constelação
  for (let i = 0; i < allConstellations.length; i++) {
    const c = allConstellations[i];
    // Verifica se a constelação é visível (zodiac sempre, extended só em VR)
    if (c.parent === extendedGroup && !extendedGroup.visible) continue;

    c.getWorldPosition(_constPos);
    _toConstDir.subVectors(_constPos, camPos).normalize();
    const dot = _cameraDir.dot(_toConstDir);

    if (dot > bestDot) {
      bestDot = dot;
      bestConstellation = c;
    }
  }

  // Atualiza highlight
  if (bestConstellation !== currentPointedConstellation) {
    currentPointedConstellation = bestConstellation;
    updateConstellationDisplay(bestConstellation);
  }

  // Anima fade in/out de cada constelação
  for (let i = 0; i < allConstellations.length; i++) {
    const c = allConstellations[i];
    const target = (c === currentPointedConstellation) ? 1 : 0;
    const current = c.userData.highlightIntensity || 0;
    const newIntensity = current + (target - current) * Math.min(1, HIGHLIGHT_FADE_SPEED * dt);
    c.userData.highlightIntensity = newIntensity;

    // Aplica aos elementos visuais
    const outlineMat = c.userData.outlineMat;
    const animalSprite = c.userData.animalSprite;
    const haloCircle = c.userData.haloCircle;
    const lineMat = c.userData.lineMat;

    if (outlineMat) {
      outlineMat.opacity = newIntensity * 0.9;
    }
    if (animalSprite) {
      // Escala e opacidade animadas
      const targetScale = 8 + newIntensity * 4;
      const currentScale = animalSprite.scale.x;
      const newScale = currentScale + (targetScale - currentScale) * Math.min(1, 5 * dt);
      animalSprite.scale.set(newScale, newScale, 1);
      animalSprite.material.opacity = newIntensity * 0.95;
    }
    if (haloCircle) {
      haloCircle.material.opacity = newIntensity * 0.35;
      haloCircle.rotation.z = time * 0.3;
      const s = 1 + Math.sin(time * 2) * 0.05;
      haloCircle.scale.set(s, s, 1);
    }
    if (lineMat) {
      // Brilha mais quando apontada
      const boost = 1 + newIntensity * 1.5;
      lineMat.opacity = c.userData.baseLineOpacity * boost;
      lineMat.color.setHex(c.userData.isZodiac ? 0xfff5d0 : lineMat.color.getHex());
    }
  }
}

function updateConstellationDisplay(constellation) {
  if (constellationNameEl) {
    if (constellation) {
      const name = constellation.userData.constellationName;
      const animal = constellation.userData.animal;
      constellationNameEl.innerHTML = `<span class="animal">${animal}</span>${name}`;
      constellationNameEl.classList.add('show');
    } else {
      constellationNameEl.classList.remove('show');
    }
  }
}

function makeBraceletTexture() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 256;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#1e1008'); g.addColorStop(0.5, '#3a2010'); g.addColorStop(1, '#1e1008');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 256);
  ctx.strokeStyle = 'rgba(212,175,90,1)'; ctx.lineWidth = 8;
  roundRect(ctx, 12, 12, 512 - 24, 256 - 24, 20); ctx.stroke();
  ctx.strokeStyle = 'rgba(212,175,90,0.4)'; ctx.lineWidth = 3;
  roundRect(ctx, 26, 26, 512 - 52, 256 - 52, 14); ctx.stroke();

  const bx = 60, by = 55, bw = 130, bh = 146;
  ctx.fillStyle = 'rgba(10,60,40,0.9)';
  ctx.strokeStyle = 'rgba(212,175,90,0.95)'; ctx.lineWidth = 5;
  roundRect(ctx, bx, by, bw, bh, 10); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(bx + 22, by); ctx.lineTo(bx + 22, by + bh);
  ctx.strokeStyle = 'rgba(212,175,90,0.85)'; ctx.lineWidth = 4; ctx.stroke();
  ctx.strokeStyle = 'rgba(240,220,180,0.5)'; ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.moveTo(bx + 34, by + 24 + i * 20);
    ctx.lineTo(bx + bw - 14, by + 24 + i * 20);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(212,175,90,1)';
  ctx.font = 'bold 26px Georgia, serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('G·I', bx + bw / 2, by + bh - 30);

  ctx.fillStyle = '#ffe8a0';
  ctx.font = 'bold 44px Georgia, serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(212,175,90,1)'; ctx.shadowBlur = 16;
  ctx.fillText('INVOCAR', 220, 100);
  ctx.font = 'bold 52px Georgia, serif';
  ctx.fillStyle = '#ffd966';
  ctx.fillText('ÁLBUM', 220, 158);
  ctx.shadowBlur = 0;

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return tex;
}
const BRACELET_TEX = makeBraceletTexture();

function buildBracelet() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.055, 0.055, 0.05, 24, 1, true),
    new THREE.MeshStandardMaterial({
      color: 0x2a1a0a, roughness: 0.6, metalness: 0.4,
      side: THREE.DoubleSide, emissive: 0x2a1005, emissiveIntensity: 0.3
    })
  );
  base.rotation.z = Math.PI / 2;
  g.add(base);
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.058, 0.006, 10, 32),
    new THREE.MeshStandardMaterial({
      color: 0xd4af5a, metalness: 1.0, roughness: 0.2,
      emissive: 0xd4af5a, emissiveIntensity: 0.6
    })
  );
  ring.rotation.y = Math.PI / 2;
  g.add(ring);
  const iconPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(0.09, 0.045),
    new THREE.MeshBasicMaterial({
      map: BRACELET_TEX, transparent: true, side: THREE.DoubleSide, depthWrite: false
    })
  );
  iconPlane.position.set(0, 0.055, 0);
  iconPlane.rotation.x = -Math.PI / 2;
  g.add(iconPlane);
  const aura = new THREE.Mesh(
    new THREE.SphereGeometry(0.10, 16, 12),
    new THREE.MeshBasicMaterial({
      color: 0xffd966, transparent: true, opacity: 0.12,
      blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  g.add(aura);
  const hitbox = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 10, 8),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  g.add(hitbox);
  g.userData.hitbox = hitbox;
  g.userData.aura = aura;
  g.userData.iconPlane = iconPlane;
  return g;
}

const braceletL = buildBracelet();
const braceletR = buildBracelet();
braceletL.visible = false;
braceletR.visible = false;
scene.add(braceletL, braceletR);

function updateBraceletTransform(hand, controller, grip, bracelet) {
  if (!isVRActive()) { bracelet.visible = false; return; }
  const inputSource = controller.inputSource;
  const usingHand = inputSource && inputSource.hand && !inputSource.gamepad;
  if (usingHand && hand && hand.joints) {
    const wrist = hand.joints['wrist'];
    if (wrist) {
      wrist.getWorldPosition(bracelet.position);
      wrist.getWorldQuaternion(bracelet.quaternion);
      bracelet.visible = true;
      return;
    }
  }
  if (grip) {
    grip.getWorldPosition(bracelet.position);
    grip.getWorldQuaternion(bracelet.quaternion);
    bracelet.visible = true;
    return;
  }
  bracelet.visible = false;
}

function checkBraceletHit(origin, dir) {
  raycaster.set(origin, dir);
  const bracelets = [braceletL, braceletR];
  for (let i = 0; i < bracelets.length; i++) {
    const b = bracelets[i];
    if (!b.visible) continue;
    if (raycaster.intersectObject(b.userData.hitbox, false).length > 0) return true;
  }
  return false;
}

const tempMatrix = new THREE.Matrix4();
function handleSelectStart(event) {
  const controller = event.target;
  tempMatrix.identity().extractRotation(controller.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

  if (checkBraceletHit(raycaster.ray.origin, raycaster.ray.direction)) {
    showAlbumInFront(); return;
  }
  if (tryStartCardGrab(controller)) return;
  if (tryStartBookGrab(controller)) return;
  if (state.mode === 'open' || state.mode === 'flipping') {
    if (raycaster.intersectObject(pageHitboxRight, false).length > 0 && state.spread < MAX_SPREAD) { flipForward(); return; }
    if (raycaster.intersectObject(pageHitboxLeft, false).length > 0 && state.spread > 1) { flipBack(); return; }
  }
  if (state.mode === 'closed') {
    if (raycaster.intersectObject(coverOutsidePlane, false).length > 0) openAlbum();
    return;
  }
  if (state.mode === 'open') {
    const allCards = [];
    bookGroup.traverse(o => { if (o.userData.isCard) allCards.push(o); });
    const hits = raycaster.intersectObjects(allCards, false);
    if (hits.length > 0) inspectCard(hits[0].object);
    return;
  }
  if (state.mode === 'inspecting') {
    if (raycaster.intersectObject(state.inspectedCard, false).length === 0) returnInspectedCard();
  }
}
function handleSelectEnd() { endCardGrab(); endBookGrab(); }
controller0.addEventListener('selectstart', handleSelectStart);
controller0.addEventListener('selectend', handleSelectEnd);
controller1.addEventListener('selectstart', handleSelectStart);
controller1.addEventListener('selectend', handleSelectEnd);

const controllerBtnStates = [{ a: false, b: false, squeeze: false }, { a: false, b: false, squeeze: false }];
function pollControllerButtons() {
  if (!renderer.xr.isPresenting) return;
  [controller0, controller1].forEach((ctrl, i) => {
    const src = ctrl.inputSource;
    if (!src || !src.gamepad) return;
    const gp = src.gamepad;
    const aPressed = gp.buttons[4] ? gp.buttons[4].pressed : false;
    const bPressed = gp.buttons[5] ? gp.buttons[5].pressed : false;
    const squeezePressed = gp.buttons[1] ? gp.buttons[1].pressed : false;
    if (aPressed && !controllerBtnStates[i].a) {
      if (state.mode === 'inspecting' && state.summoned) toggleCardTerrain();
      else showAlbumInFront();
    }
    if (bPressed && !controllerBtnStates[i].b) {
      if (state.mode === 'inspecting' && state.summoned) triggerAttack();
      else if (state.mode === 'closed') openAlbum();
      else if (state.mode === 'open') closeAlbum();
    }
    if (squeezePressed && !controllerBtnStates[i].squeeze) showAlbumInFront();
    controllerBtnStates[i].a = aPressed;
    controllerBtnStates[i].b = bPressed;
    controllerBtnStates[i].squeeze = squeezePressed;
  });
}

renderer.xr.addEventListener('sessionstart', () => {
  extendedGroup.visible = true;
  zodiacGroup.visible = true;
  showAlbumInFront();
  controllerBtnStates[0] = { a: false, b: false, squeeze: false };
  controllerBtnStates[1] = { a: false, b: false, squeeze: false };
  setTimeout(startVoice, 1500);
  refreshUI();
});
renderer.xr.addEventListener('sessionend', () => {
  extendedGroup.visible = false;
  disableBookVR();
  endBookGrab();
  endCardGrab();
  state.mode = 'closed'; state.spread = 0;
  coverInfo.pivot.rotation.z = 0;
  coverInfo.pivot.position.y = coverInfo.originalY;
  sheet1.pivot.rotation.z = 0; sheet1.pivot.position.y = sheet1.originalY;
  sheet2.pivot.rotation.z = 0; sheet2.pivot.position.y = sheet2.originalY;
  constellationNameEl.classList.remove('show');
  camera.position.copy(CAM_CLOSED);
  controls.target.copy(TARGET_CLOSED);
  controls.enabled = true;
  controls.update();
  refreshUI();
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
refreshUI();
let lastTime = performance.now();
const _tmpV1 = new THREE.Vector3();
const _tmpV2 = new THREE.Vector3();
const _tmpV3 = new THREE.Vector3();
const _tmpM1 = new THREE.Matrix4();

renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const tGlobal = now * 0.001;

  updateTweens(now);
  pollControllerButtons();
  updateBookGrab();
  updateCardGrab();
  updateBookVRTransform(dt);

  // ★ Detecção de apontar para constelações ★
  updateConstellationPointing(dt, tGlobal);

  // Braceletes
  if (hand0 && hand1) {
    updateBraceletTransform(hand0, controller0, grip0, braceletL);
    updateBraceletTransform(hand1, controller1, grip1, braceletR);
  } else {
    if (grip0) {
      grip0.getWorldPosition(braceletL.position);
      grip0.getWorldQuaternion(braceletL.quaternion);
      braceletL.visible = isVRActive();
    }
    if (grip1) {
      grip1.getWorldPosition(braceletR.position);
      grip1.getWorldQuaternion(braceletR.quaternion);
      braceletR.visible = isVRActive();
    }
  }
  [braceletL, braceletR].forEach((b, i) => {
    if (!b.visible) return;
    if (b.userData.aura) {
      const s = 1 + Math.sin(tGlobal * 3 + i) * 0.15;
      b.userData.aura.scale.setScalar(s);
      b.userData.aura.material.opacity = 0.10 + Math.sin(tGlobal * 3 + i) * 0.08;
    }
    if (b.userData.iconPlane) {
      b.userData.iconPlane.position.y = 0.055 + Math.sin(tGlobal * 2 + i) * 0.003;
    }
  });

  skyMesh.rotation.y += dt * 0.0015;

  // ★ Estrelas ★
  for (let i = 0; i < starLayers.length; i++) {
    const layer = starLayers[i];
    layer.material.opacity = layer.userData.baseOpacity *
      (0.75 + Math.sin(tGlobal * layer.userData.pulseSpeed + layer.userData.pulsePhase) * 0.25);
    layer.rotation.y += dt * (0.001 + i * 0.0004);
  }

  // ★ Estrelas das constelações ★
  for (let i = 0; i < allPulsingStars.length; i++) {
    const s = allPulsingStars[i];
    const base = s.userData.baseScale;
    const pulse = 1 + Math.sin(tGlobal * s.userData.pulseSpeed + s.userData.pulsePhase) * 0.22;
    s.scale.set(base * pulse, base * pulse, 1);
    s.material.opacity = s.userData.baseOpacity *
      (0.65 + Math.sin(tGlobal * s.userData.pulseSpeed * 1.3 + s.userData.pulsePhase) * 0.35);
  }

  // ★ Linhas das constelações ★
  for (let ci = 0; ci < allConstellations.length; ci++) {
    const c = allConstellations[ci];
    if (c.parent && c.parent.visible === false) continue;
    if (c.userData.lineMat) {
      const boost = 1 + (c.userData.highlightIntensity || 0) * 1.5;
      c.userData.lineMat.opacity = c.userData.baseLineOpacity * boost *
        (0.7 + Math.sin(tGlobal * 1.4 + c.userData.phase) * 0.3);
    }
  }

  // ★ NEBULOSAS — movimento próprio ★
  for (let i = 0; i < nebulaLayers.length; i++) {
    const n = nebulaLayers[i];
    const u = n.userData;

    // Drift orbital próprio (não depende do visor!)
    const dx = Math.sin(tGlobal * u.driftSpeedX + u.driftPhaseX) * u.driftRadius;
    const dy = Math.sin(tGlobal * u.driftSpeedY + u.driftPhaseY) * u.driftRadius * 0.6;
    const dz = Math.cos(tGlobal * u.driftSpeedZ + u.driftPhaseZ) * u.driftRadius;
    n.position.set(u.baseX + dx, u.baseY + dy, u.baseZ + dz);

    // Rotação própria lenta
    n.material.rotation += u.rotSpeed * dt * 5;

    // Pulsação de opacidade
    const pulseOp = 0.78 + Math.sin(tGlobal * u.pulseSpeed + u.pulsePhase) * 0.22;
    n.material.opacity = u.baseOpacity * pulseOp;

    // Pulsação de escala (efeito "respirando")
    const scalePulse = 1 + Math.sin(tGlobal * u.pulseSpeed * 1.7 + u.pulsePhase) * u.scalePulse;
    n.scale.set(u.baseScaleX * scalePulse, u.baseScaleY * scalePulse, 1);
  }

  // Estrelas cadentes
  shootingStarTimer += dt;
  if (shootingStarTimer > SHOOTING_INTERVAL) {
    shootingStarTimer = 0;
    spawnShootingStar();
  }
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const ss = shootingStars[i];
    ss.t += dt / ss.life;
    if (ss.t >= 1) {
      scene.remove(ss.group);
      ss.head.material.dispose();
      ss.trailMat.dispose();
      shootingStars.splice(i, 1);
      continue;
    }
    const p = ss.t;
    _tmpV1.lerpVectors(ss.startPos, ss.endPos, p);
    ss.group.position.copy(_tmpV1);
    const dir = ss.tailDir;
    const up = Math.abs(dir.y) > 0.95 ? _tmpV2.set(1, 0, 0) : _tmpV2.set(0, 1, 0);
    const right = _tmpV3.crossVectors(dir, up).normalize();
    const realUp = _tmpV2.crossVectors(right, dir).normalize();
    ss.group.quaternion.setFromRotationMatrix(_tmpM1.makeBasis(dir, realUp, right));
    const fade = 1 - Math.max(0, p - 0.75) / 0.25;
    ss.head.material.opacity = fade;
    ss.trailMat.opacity = 0.95 * fade;
  }

  if (state.inspectedCard && (renderer.xr.isPresenting || state.vrPreview)
      && !isGrabbingCard && !cardWasManuallyPlaced
      && state.cardLayout === 'face') {
    state.inspectedCard.getWorldPosition(_tmpV1);
    camera.getWorldPosition(_tmpV2);
    state.inspectedCard.quaternion.copy(computeCardFacingQuat(_tmpV1, _tmpV2));
    cardTargetQuat.copy(state.inspectedCard.quaternion);
  }

  if (state.summoned && state.inspectedCard) {
    state.holoTime += dt;
    const t = state.holoTime;
    const holo = state.summoned;
    state.inspectedCard.getWorldPosition(_tmpV1);
    const inVR = isVRActive();
    let yOff = inVR ? 0.22 : 2.1;
    if (state.cardLayout === 'terrain') yOff = inVR ? 0.35 : 2.2;
    const bob = Math.sin(t * 1.4) * 0.10;
    const swayX = Math.sin(t * 0.6) * 0.05;
    const swayZ = Math.cos(t * 0.5) * 0.05;
    const targetX = _tmpV1.x + swayX;
    const targetY = _tmpV1.y + yOff + bob;
    const targetZ = _tmpV1.z + swayZ;
    if (!holo.userData.initialized) {
      holo.position.set(targetX, targetY, targetZ);
      holo.userData.initialized = true;
    } else if (!state.isAttacking) {
      holo.position.x += (targetX - holo.position.x) * 0.15;
      holo.position.y += (targetY - holo.position.y) * 0.15;
      holo.position.z += (targetZ - holo.position.z) * 0.15;
    }
    const planes = holo.userData.planes;
    const yOffLocal = holo.userData.y || 1.75;
    if (planes) {
      for (let i = 0; i < planes.length; i++) {
        const p = planes[i];
        p.lookAt(camera.position);
        if (i === 1) p.position.set(0.015 + Math.sin(t * 14) * 0.006, yOffLocal, 0.01);
        else if (i === 2) p.position.set(-0.015 + Math.sin(t * 14 + 1.5) * 0.006, yOffLocal, 0.01);
        else p.position.y = yOffLocal;
      }
    }
    if (holo.userData.outerRing) holo.userData.outerRing.rotation.z = t * 0.4;
    if (holo.userData.runes) holo.userData.runes.rotation.y = t * 0.5;
    if (holo.userData.beam) holo.userData.beam.material.opacity = 0.18 + Math.sin(t * 3) * 0.06;
    if (holo.userData.gem) {
      holo.userData.gem.rotation.y = t * 1.5;
      holo.userData.gem.rotation.x = t * 0.9;
    }
    holo.traverse(o => {
      if (o.userData.isParticles) {
        const seeds = o.userData.seeds;
        const pos = o.geometry.attributes.position.array;
        for (let i = 0; i < seeds.length; i++) {
          const s = seeds[i];
          const a = s.a + t * s.speed;
          pos[i*3] = Math.cos(a) * s.r;
          pos[i*3+1] = s.y + Math.sin(t * 1.8 + s.phase) * 0.15;
          pos[i*3+2] = Math.sin(a) * s.r;
        }
        o.geometry.attributes.position.needsUpdate = true;
      }
    });
  }

  if (!renderer.xr.isPresenting && !state.vrPreview) controls.update();
  renderer.render(scene, camera);
});

setTimeout(() => {
  const l = document.getElementById('loading');
  l.classList.add('hide');
  setTimeout(() => l.remove(), 700);
}, 400);
</script>
