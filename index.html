const TW = 640, TH = 960;
function roundRect(ctx, x, y, w, h, r) {

  lines.forEach((l, i) => ctx.fillText(l, cx, s + i * lh));

function drawGoldCorner(ctx, x, y, s, flip = false) {

  ctx.lineTo(s * 0.75, s * 0.18); ctx.stroke();

  ctx.moveTo(s * 0.18, s * 0.18 - 6);

  const vig = ctx.createRadialGradient(TW/2, TH/2, TH*0.35, TW/2, TH/2, TH*0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, TW, TH);

}
let _backTexCache = null;
function makeBackTexture() {
  if (_backTexCache) return _backTexCache;
  const cv = document.createElement('canvas');
  cv.width = TW; cv.height = TH;
  const ctx = cv.getContext('2d');
  const bg = ctx.createLinearGradient(0, 0, TW, TH);
  bg.addColorStop(0, '#0d2a20'); bg.addColorStop(0.5, '#041410'); bg.addColorStop(1, '#0d2a20');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, TW, TH);

    ctx.beginPath(); ctx.arc(x, y, Math.random() * 1.4 + 0.2, 0, 7); ctx.fill();
  }

  roundRect(ctx, 22, 22, TW - 44, TH - 44, 30); ctx.stroke();

  ctx.strokeStyle = emerald; ctx.lineWidth = 2;
  ctx.fillStyle = 'rgba(80,220,150,0.10)';

function makeStarRoundTexture(hardness = 0.35) {
  // hardness: 0 = muito suave, 1 = muito dura
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const ctx = cv.getContext('2d');
  const c = S / 2;
  const g = ctx.createRadialGradient(c, c, 0, c, c, c);
  const h = Math.max(0.05, Math.min(0.95, hardness));
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(h * 0.5, 'rgba(255,255,255,1)');
  g.addColorStop(h, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.75, 'rgba(255,255,255,0.28)');
  g.addColorStop(0.92, 'rgba(255,255,255,0.05)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(c, c, c, 0, Math.PI * 2);
  ctx.fill();
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  tex.minFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  return tex;
}

  for (let i = 0; i < 40; i++) {

function buildConstellation(pts, name, scale = 1.0, color = 0xbcd8ff, intensity = 0.9) {
  const group = new THREE.Group();
  const center = pts.reduce((a, p) => [a[0] + p[0], a[1] + p[1]], [0,0]);
  center[0] /= pts.length; center[1] /= pts.length;
  const localPts = pts.map(p => [(p[0] - center[0]) * 7 * scale, (p[1] - center[1]) * 7 * scale]);
  const lineMat = new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 0.35 * intensity,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  group.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(localPts.map(p => new THREE.Vector3(p[0], p[1], 0))),
    lineMat
  ));
  localPts.forEach(p => {
    // Halo suave externo (atrás)
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: STAR_HALO_TEX,
      color: color,
      transparent: true,
      opacity: 0.55 * intensity,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: false
    }));
    glow.scale.set(9, 9, 1);
    glow.position.set(p[0], p[1], -0.1);
    group.add(glow);

    // Núcleo da estrela (redondo)
    const core = new THREE.Sprite(new THREE.SpriteMaterial({
      map: STAR_TEX,
      color: 0xffffff,
      transparent: true,
      opacity: 0.98 * intensity,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: false
    }));
    core.scale.set(2.2, 2.2, 1);
    core.position.set(p[0], p[1], 0);
    group.add(core);

    // Glow intermediário colorido
    const mid = new THREE.Sprite(new THREE.SpriteMaterial({
      map: STAR_TEX,
      color: color,
      transparent: true,
      opacity: 0.65 * intensity,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: false
    }));
    mid.scale.set(4.5, 4.5, 1);
    mid.position.set(p[0], p[1], -0.05);
    group.add(mid);
  });
  group.userData.lineMat = lineMat;
  group.userData.phase = Math.random() * Math.PI * 2;
  return group;
}
function placeConstellation(group, azimuth, elevation, dist = SKY_RADIUS * 0.85) {
  group.position.set(
    dist * Math.cos(elevation) * Math.cos(azimuth),
    dist * Math.sin(elevation),
    dist * Math.cos(elevation) * Math.sin(azimuth)
  );
  group.lookAt(0, 0, 0);
}
ZODIAC.forEach((z, i) => {
  const g = buildConstellation(z.pts, z.name, 1.2, 0xbcd8ff, 1.0);
  placeConstellation(g, (i / ZODIAC.length) * Math.PI * 2, 0.35 + (i % 3) * 0.18);
  zodiacGroup.add(g);
});
extendedNames.forEach((name, i) => {
  const seed = i * 7 + 13;
  const rnd = (n) => { const x = Math.sin(seed * n * 12.9898) * 43758.5453; return x - Math.floor(x); };
  const numPts = 4 + Math.floor(rnd(1) * 4);
  const pts = []; let cx = 0, cy = 0;
  for (let j = 0; j < numPts; j++) {
    cx += (rnd(j + 2) - 0.5) * 2.6;
    cy += (rnd(j + 9) - 0.5) * 2.6;
    pts.push([cx, cy]);
  }
  const g = buildConstellation(pts, name, 0.85, 0xc8d8ff, 0.75);
  placeConstellation(g, (i / extendedNames.length) * Math.PI * 2 + 0.3, 0.15 + (i % 4) * 0.14);
  extendedGroup.add(g);
});

   TWEEN
   ============================================================ */
const activeTweens = [];
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function animate(duration, updateFn, completeFn, ease = easeInOutCubic) {
  const t0 = performance.now();
  const tw = {
    update(now) {
      const p = Math.min(1, (now - t0) / duration);
      updateFn(ease(p), p);
      return p < 1;
    },
    complete: completeFn
  };
  activeTweens.push(tw);
  return tw;
}
function updateTweens(now) {
  for (let i = activeTweens.length - 1; i >= 0; i--) {
    const done = !activeTweens[i].update(now);
    if (done) {
      const cb = activeTweens[i].complete;
      activeTweens.splice(i, 1);
      if (cb) cb();
    }
  }
}

function isVRActive() { return renderer.xr.isPresenting || state.vrPreview; }

function openAlbum() {
  if (state.mode !== 'closed') return;
  state.mode = 'flipping'; state.spread = 1; refreshUI();
  const sR = coverInfo.pivot.rotation.z, sY = coverInfo.pivot.position.y;
  const camStart = camera.position.clone();
  const tgtStart = controls.target.clone();
  const vr = isVRActive();
  const startX = bookGroup.position.x;
  const endX = VR_BOOK_X_OPEN;

  animate(1200, (t) => {
    coverInfo.pivot.rotation.z = sR + (Math.PI - sR) * t;
    coverInfo.pivot.position.y = sY + (coverInfo.flippedY - sY) * t;
    if (vr) bookGroup.position.x = startX + (endX - startX) * t;
    if (!vr) {
      camera.position.lerpVectors(camStart, CAM_OPEN, t);
      controls.target.lerpVectors(tgtStart, TARGET_OPEN, t);
      controls.update();
    }
  }, () => { state.mode = 'open'; refreshUI(); });
}
function closeAlbum() {
  if (state.mode !== 'open') return;
  if (state.spread > 1) { flipBack(() => closeAlbum()); return; }
  state.mode = 'flipping'; refreshUI();
  const sR = coverInfo.pivot.rotation.z, sY = coverInfo.pivot.position.y;
  const camStart = camera.position.clone();
  const tgtStart = controls.target.clone();
  const vr = isVRActive();
  const startX = bookGroup.position.x;
  const endX = VR_BOOK_X_CLOSED;

  animate(1200, (t) => {
    coverInfo.pivot.rotation.z = sR * (1 - t);
    coverInfo.pivot.position.y = sY + (coverInfo.originalY - sY) * t;
    if (vr) bookGroup.position.x = startX + (endX - startX) * t;
    if (!vr) {
      camera.position.lerpVectors(camStart, CAM_CLOSED, t);
      controls.target.lerpVectors(tgtStart, TARGET_CLOSED, t);
      controls.update();
    }
  }, () => { state.mode = 'closed'; state.spread = 0; refreshUI(); });
}
function flipForward() {
  if (state.mode !== 'open' || state.spread >= MAX_SPREAD) return;
  state.mode = 'flipping'; refreshUI();
  let target = state.spread === 1 ? sheet1 : state.spread === 2 ? sheet2 : null;
  if (!target) return;
  const sR = target.pivot.rotation.z, sY = target.pivot.position.y;
  animate(950, (t) => {
    target.pivot.rotation.z = sR + (Math.PI - sR) * t;
    target.pivot.position.y = sY + (target.flippedY - sY) * t;
    target.pivot.position.y += Math.sin(t * Math.PI) * 0.06;
  }, () => {
    target.pivot.rotation.z = Math.PI;
    target.pivot.position.y = target.flippedY;
    state.spread++; state.mode = 'open'; refreshUI();
  });
}
function flipBack(callback) {
  if (state.mode !== 'open' || state.spread <= 1) { if (callback) callback(); return; }
  state.mode = 'flipping'; refreshUI();
  let target = state.spread === 2 ? sheet1 : state.spread === 3 ? sheet2 : null;
  if (!target) { state.mode = 'open'; refreshUI(); return; }
  const sR = target.pivot.rotation.z, sY = target.pivot.position.y;
  animate(950, (t) => {
    target.pivot.rotation.z = sR * (1 - t);
    target.pivot.position.y = sY + (target.originalY - sY) * t;
    target.pivot.position.y += Math.sin(t * Math.PI) * 0.06;
  }, () => {
    target.pivot.rotation.z = 0;
    target.pivot.position.y = target.originalY;
    state.spread--; state.mode = 'open'; refreshUI();
    if (callback) callback();
  });
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
function setPointer(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}
function pickCard() {
  raycaster.setFromCamera(pointer, camera);
  const allCards = [];
  bookGroup.traverse(o => { if (o.userData.isCard) allCards.push(o); });
  const hits = raycaster.intersectObjects(allCards, false);
  return hits.length ? hits[0].object : null;
}
function pickCover() {
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObject(coverOutsidePlane, false).length > 0;
}
function pickVRPageButton() {
  raycaster.setFromCamera(pointer, camera);
  if (!vrUIGroup.visible) return null;
  if (pageNextBtn.visible) {
    const hits = raycaster.intersectObject(pageNextBtn.userData.hit, false);
    if (hits.length > 0) return pageNextBtn;
  }
  if (pagePrevBtn.visible) {
    const hits = raycaster.intersectObject(pagePrevBtn.userData.hit, false);
    if (hits.length > 0) return pagePrevBtn;
  }
  return null;
}
function computeCardFacingQuat(cardPos, camPos) {
  const yDir = new THREE.Vector3().subVectors(camPos, cardPos).normalize();
  const zDir = new THREE.Vector3(0, -1, 0).projectOnPlane(yDir).normalize();
  const xDir = new THREE.Vector3().crossVectors(yDir, zDir).normalize();
  return new THREE.Quaternion().setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(xDir, yDir, zDir)
  );
}

function summonHologram(card) {
  const data = card.userData.cardData;
  const cardWorldPos = new THREE.Vector3();
  card.getWorldPosition(cardWorldPos);
  const holo = buildHologram(data);
  const vr = isVRActive();
  // Em VR: 8cm acima da carta. Desktop: 2.1 unidades
  const yOff = vr ? 0.08 : 2.1;
  holo.position.copy(cardWorldPos).add(new THREE.Vector3(0, yOff, 0));
  holo.scale.setScalar(0.01);
  scene.add(holo);
  state.summoned = holo;
  state.holoTime = 0;
  const targetScale = vr ? 0.65 : 0.9;
  animate(750, (t) => { holo.scale.setScalar(0.01 + t * targetScale); },
    () => { holo.scale.setScalar(targetScale); }, easeOutCubic);
}
function desummonHologram(onComplete) {
  if (!state.summoned) { if (onComplete) onComplete(); return; }
  const holo = state.summoned;
  state.summoned = null;
  const bc = 50;
  const bGeo = new THREE.BufferGeometry();
  const pos = new Float32Array(bc * 3);
  const col = new Float32Array(bc * 3);
  const vel = [];
  const c = new THREE.Color(0x88ddff);
  for (let i = 0; i < bc; i++) {
    pos[i*3] = holo.position.x;
    pos[i*3+1] = holo.position.y + 0.3;
    pos[i*3+2] = holo.position.z;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const s = 0.4 + Math.random() * 0.8;
    vel.push({
      x: Math.sin(phi) * Math.cos(theta) * s,
      y: Math.cos(phi) * s + 0.3,
      z: Math.sin(phi) * Math.sin(theta) * s
    });
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  bGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  bGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const bMat = new THREE.PointsMaterial({
    size: 0.04, vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const burst = new THREE.Points(bGeo, bMat);
  scene.add(burst);
  const sScale = holo.scale.x;
  animate(500, (t) => {
    holo.scale.setScalar(sScale * (1 - t));
    const p = burst.geometry.attributes.position.array;
    for (let i = 0; i < bc; i++) {
      p[i*3] += vel[i].x * 0.016;
      p[i*3+1] += vel[i].y * 0.016;
      p[i*3+2] += vel[i].z * 0.016;
      vel[i].y -= 0.02;
    }
    burst.geometry.attributes.position.needsUpdate = true;
    bMat.opacity = 1 - t;
  }, () => {
    scene.remove(holo);
    holo.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    });
    animate(400, (t) => { bMat.opacity = 1 - t; bMat.size = 0.04 * (1 + t * 2); }, () => {
      scene.remove(burst); bGeo.dispose(); bMat.dispose();
      if (onComplete) onComplete();
    });
  });
}

/* ============================================================
   INSPECIONAR / DEVOLVER
   ============================================================ */
function inspectCard(card) {
  if (state.summoned) { desummonHologram(() => doInspect(card)); return; }
  doInspect(card);
}
function doInspect(card) {
  state.mode = 'inspecting';
  state.inspectedCard = card;
  state.cardOriginalParent = card.parent;
  state.cardOriginalPos = card.position.clone();
  state.cardOriginalQuat = card.quaternion.clone();
  state.cardOriginalScale = card.scale.clone();
  scene.attach(card);

  const camPos = new THREE.Vector3();
  camera.getWorldPosition(camPos);
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  const vr = isVRActive();
  const dist = vr ? 0.28 : 6.8;
  const targetPos = camPos.clone().addScaledVector(camDir, dist);
  const targetQuat = computeCardFacingQuat(targetPos, camPos);
  const startPos = card.position.clone();
  const startQuat = card.quaternion.clone();
  const startScale = card.scale.clone();
  // Tamanho real da carta: ~7cm × 12cm
  const targetScale = vr
    ? new THREE.Vector3(0.05, 0.05, 0.05)
    : new THREE.Vector3(1.3, 1.3, 1.3);

  controls.enabled = false;
  refreshUI();
  animate(600, (t) => {
    card.position.lerpVectors(startPos, targetPos, t);
    card.quaternion.slerpQuaternions(startQuat, targetQuat, t);
    card.scale.lerpVectors(startScale, targetScale, t);
  }, () => {
    card.position.copy(targetPos);
    card.quaternion.copy(targetQuat);
    card.scale.copy(targetScale);
    summonHologram(card);
    refreshUI();
  }, easeOutCubic);
}
function returnInspectedCard() {
  if (!state.inspectedCard) return;
  const card = state.inspectedCard;
  if (state.summoned) desummonHologram(() => returnCardToAlbum(card));
  else returnCardToAlbum(card);
}
function returnCardToAlbum(card) {
  const parent = state.cardOriginalParent;
  parent.updateWorldMatrix(true, false);
  const targetWorldPos = state.cardOriginalPos.clone().applyMatrix4(parent.matrixWorld);
  const parentWorldQuat = new THREE.Quaternion();
  parent.getWorldQuaternion(parentWorldQuat);
  const targetWorldQuat = parentWorldQuat.clone().multiply(state.cardOriginalQuat);
  const startPos = card.position.clone();
  const startQuat = card.quaternion.clone();
  const startScale = card.scale.clone();
  const targetScale = state.cardOriginalScale.clone();
  state.mode = 'flipping';
  state.inspectedCard = null;
  refreshUI();
  animate(550, (t) => {
    card.position.lerpVectors(startPos, targetWorldPos, t);
    card.quaternion.slerpQuaternions(startQuat, targetWorldQuat, t);
    card.scale.lerpVectors(startScale, targetScale, t);
  }, () => {
    parent.add(card);
    card.position.copy(state.cardOriginalPos);
    card.quaternion.copy(state.cardOriginalQuat);
    card.scale.copy(state.cardOriginalScale);
    state.mode = 'open';
    controls.enabled = true;
    refreshUI();
  });
}

/* ============================================================
   DRAG DESKTOP
   ============================================================ */
let pointerDownOnCard = false;
let pointerDownPos = new THREE.Vector2();
let pointerDownTime = 0;
let dragPlane = new THREE.Plane();
let dragOffset = new THREE.Vector3();
let didDrag = false;
const DRAG_THRESHOLD_PX = 6;

function startCardDrag(e, card) {
  pointerDownOnCard = true;
  pointerDownPos.set(e.clientX, e.clientY);
  pointerDownTime = performance.now();
  didDrag = false;
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  const cardPos = new THREE.Vector3();
  card.getWorldPosition(cardPos);
  dragPlane.setFromNormalAndCoplanarPoint(camDir, cardPos);
  raycaster.setFromCamera(pointer, camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(dragPlane, hit)) dragOffset.copy(cardPos).sub(hit);
}
function updateCardDrag(e) {
  if (!pointerDownOnCard || !state.inspectedCard) return;
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  if (!didDrag && dx*dx + dy*dy > DRAG_THRESHOLD_PX * DRAG_THRESHOLD_PX) {
    didDrag = true;
    renderer.domElement.style.cursor = 'grabbing';
  }
  if (!didDrag) return;
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(dragPlane, hit)) {
    const newPos = hit.clone().add(dragOffset);
    state.inspectedCard.position.copy(newPos);
    if (state.summoned) {
      const yOff = isVRActive() ? 0.08 : 2.1;
      state.summoned.position.copy(newPos).add(new THREE.Vector3(0, yOff, 0));
    }
  }
}
function endCardDrag(e) {
  if (!pointerDownOnCard) return;
  const wasClick = !didDrag && (performance.now() - pointerDownTime) < 500;
  pointerDownOnCard = false;
  if (wasClick && state.inspectedCard) { returnInspectedCard(); return; }
  if (didDrag) renderer.domElement.style.cursor = 'pointer';
}

/* EVENTOS MOUSE */
function onPointerDown(e) {
  if (e.button !== 0 || state.isVR) return;
  setPointer(e);
  if (state.vrPreview) {
    const btn = pickVRPageButton();
    if (btn) {
      if (btn === pageNextBtn) flipForward();
      else if (btn === pagePrevBtn) flipBack();
      return;
    }
  }
  if (state.mode === 'closed') { if (pickCover()) openAlbum(); return; }
  if (state.mode === 'open') {
    const card = pickCard();
    if (card) inspectCard(card);
    return;
  }
  if (state.mode === 'inspecting') {
    raycaster.setFromCamera(pointer, camera);
    if (raycaster.intersectObject(state.inspectedCard, false).length > 0) {
      startCardDrag(e, state.inspectedCard);
    } else returnInspectedCard();
  }
}
function onPointerMove(e) {
  if (state.isVR) return;
  if (state.mode === 'inspecting' && pointerDownOnCard) { updateCardDrag(e); return; }
  if (state.vrPreview) {
    setPointer(e);
    const btn = pickVRPageButton();
    renderer.domElement.style.cursor = btn ? 'pointer' : 'default';
    return;
  }
  if (state.mode === 'closed') {
    setPointer(e);
    renderer.domElement.style.cursor = pickCover() ? 'pointer' : 'grab';
  } else if (state.mode === 'open') {
    setPointer(e);
    renderer.domElement.style.cursor = pickCard() ? 'pointer' : 'grab';
  } else if (state.mode === 'inspecting') {
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    renderer.domElement.style.cursor =
      raycaster.intersectObject(state.inspectedCard, false).length > 0 ? 'grab' : 'default';
  }
}
function onPointerUp(e) { if (pointerDownOnCard) endCardDrag(e); }

renderer.domElement.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.mode === 'inspecting') returnInspectedCard();
    else if (state.mode === 'open') closeAlbum();
  }
  if (e.key === 'ArrowRight' && state.mode === 'open') flipForward();
  if (e.key === 'ArrowLeft' && state.mode === 'open') flipBack();
  if ((e.key === 'd' || e.key === 'D') && state.summoned) desummonHologram();
  if ((e.key === 'b' || e.key === 'B')) {
    if (state.mode === 'closed') openAlbum();
    else if (state.mode === 'open') closeAlbum();
  }
});

function attachBookToCamera() {
  if (bookGroup.parent === camera) return;
  // Preserva posição desktop como segurança, mas reparenta
  scene.remove(bookGroup);
  camera.add(bookGroup);
  state.bookInCamera = true;
}
function attachBookToScene() {
  if (bookGroup.parent === scene) return;
  camera.remove(bookGroup);
  scene.add(bookGroup);
  state.bookInCamera = false;
}

/* Posiciona o livro em espaço LOCAL da câmera (fica na frente da cabeça) */
function positionBookForVR() {
  bookGroup.scale.setScalar(VR_SCALE);
  bookGroup.position.set(VR_BOOK_X_CLOSED, VR_BOOK_Y, VR_BOOK_Z);
  bookGroup.rotation.set(VR_BOOK_TILT, 0, 0);
}

/* Animação de aparição — em espaço local da câmera */
function animateBookAppearance() {
  const targetScale = VR_SCALE;
  const targetPos = new THREE.Vector3(VR_BOOK_X_CLOSED, VR_BOOK_Y, VR_BOOK_Z);
  const targetRotX = VR_BOOK_TILT;
  const startPos = new THREE.Vector3(0, -0.5, -0.15);
  const startRotX = 0.4;

  bookGroup.scale.setScalar(0.001);
  bookGroup.position.copy(startPos);
  bookGroup.rotation.set(startRotX, -0.6, 0);

  animate(1400, (t) => {
    bookGroup.scale.setScalar(t * targetScale);
    bookGroup.position.lerpVectors(startPos, targetPos, t);
    bookGroup.rotation.set(
      startRotX * (1 - t) + targetRotX * t,
      -0.6 * (1 - t),
      0.15 * Math.sin(t * Math.PI) * (1 - t)
    );
  }, () => {
    bookGroup.scale.setScalar(targetScale);
    bookGroup.position.copy(targetPos);
    bookGroup.rotation.set(targetRotX, 0, 0);
  }, easeOutBack);
}

let savedCameraPos = new THREE.Vector3();

function enterVRPreview() {
  if (state.vrPreview || state.isVR) return;
  state.vrPreview = true;
  savedCameraPos.copy(camera.position);
  savedCameraQuat.copy(camera.quaternion);
  savedTarget.copy(controls.target);

  vrPreviewOverlay.classList.add('active');

function exitVRPreview() {
  if (!state.vrPreview) return;

  attachBookToScene();
  bookGroup.position.set(0, 1.0, -1.5);

  bookGroup.scale.setScalar(1);

  // Câmera de volta
  camera.position.copy(savedCameraPos);
  camera.quaternion.copy(savedCameraQuat);
  controls.target.copy(savedTarget);
  controls.enabled = savedControlsEnabled;
  controls.update();
  extendedGroup.visible = false;
  refreshUI();
}

function handleVRSelect(event) {
  const controller = event.target;
  const tempMatrix = new THREE.Matrix4();
  tempMatrix.identity().extractRotation(controller.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

  // 1) Botões de virar página
  if (vrUIGroup.visible) {
    if (pageNextBtn.visible && raycaster.intersectObject(pageNextBtn.userData.hit, false).length > 0) {
      flipForward(); return;
    }
    if (pagePrevBtn.visible && raycaster.intersectObject(pagePrevBtn.userData.hit, false).length > 0) {
      flipBack(); return;
    }
  }
  // 2) Bracelete
  if (raycaster.intersectObject(vrBraceletL.userData.hitbox, false).length > 0) {
    toggleBookVR(); return;
  }
  // 3) Capa
  if (state.mode === 'closed') {
    if (raycaster.intersectObject(coverOutsidePlane, false).length > 0) openAlbum();
    return;
  }
  // 4) Cartas
  if (state.mode === 'open') {
    const allCards = [];
    bookGroup.traverse(o => { if (o.userData.isCard) allCards.push(o); });
    const hits = raycaster.intersectObjects(allCards, false);
    if (hits.length > 0) inspectCard(hits[0].object);
    return;
  }
  // 5) Devolver
  if (state.mode === 'inspecting') {
    if (raycaster.intersectObject(state.inspectedCard, false).length === 0) {
      returnInspectedCard();
    }
  }
}

/* ============================================================
   RESIZE + LOOP
   ============================================================ */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
window.addEventListener('resize', onResize);
refreshUI();
let lastTime = performance.now();

renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  updateTweens(now);

  skyMesh.rotation.y += dt * 0.002;
  const tGlobal = now * 0.001;

  [zodiacGroup, extendedGroup].forEach(grp => {
    if (!grp.visible) return;
    grp.children.forEach((c) => {
      if (c.userData.lineMat) {
        c.userData.lineMat.opacity = 0.35 + Math.sin(tGlobal * 1.2 + c.userData.phase) * 0.15;
      }
    });
  });

  shootingStarTimer += dt;
  if (shootingStarTimer > 2.5) { shootingStarTimer = 0; spawnShootingStar(); }
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const ss = shootingStars[i];
    ss.t += dt / ss.life;
    if (ss.t >= 1) {
      scene.remove(ss.group, ss.trail);
      ss.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
      ss.trail.geometry.dispose(); ss.trail.material.dispose();
      shootingStars.splice(i, 1);
      continue;
    }
    const p = ss.t;
    const pos = new THREE.Vector3().lerpVectors(ss.startPos, ss.endPos, p);
    ss.group.position.copy(pos);
    ss.tail.position.set(-ss.tailDir.x * 4, -ss.tailDir.y * 4, -ss.tailDir.z * 4);
    ss.tail.lookAt(
      ss.tail.position.x - ss.tailDir.x * 10,
      ss.tail.position.y - ss.tailDir.y * 10,
      ss.tail.position.z - ss.tailDir.z * 10
    );
    ss.tail.rotateX(Math.PI / 2);
    const tp = ss.trail.geometry.attributes.position.array;
    const tl = Math.min(p * 8, 6);
    tp[0] = pos.x - ss.tailDir.x * tl;
    tp[1] = pos.y - ss.tailDir.y * tl;
    tp[2] = pos.z - ss.tailDir.z * tl;
    tp[3] = pos.x; tp[4] = pos.y; tp[5] = pos.z;
    ss.trail.geometry.attributes.position.needsUpdate = true;
    const fade = 1 - Math.max(0, p - 0.7) / 0.3;
    ss.core.material.opacity = fade;
    ss.trail.material.opacity = 0.9 * fade;
    ss.tail.material.opacity = 0.55 * fade;
  }

  // UI VR — atualiza posição/rotação dos botões
  const vrActive = renderer.xr.isPresenting || state.vrPreview;
  if (vrActive) {
    // Pega a posição mundial do livro (funciona mesmo sendo filho da câmera)
    const bp = new THREE.Vector3();
    bookGroup.getWorldPosition(bp);

    vrUIGroup.position.copy(bp);
    vrUIGroup.visible = state.mode === 'open';

    const camWorldPos = new THREE.Vector3();
    camera.getWorldPosition(camWorldPos);
    pageNextBtn.lookAt(camWorldPos);
    pagePrevBtn.lookAt(camWorldPos);

    pageNextBtn.visible = state.spread < MAX_SPREAD;
    pagePrevBtn.visible = state.spread > 1;

    [pageNextBtn, pagePrevBtn].forEach((b, i) => {
      const ph = i * 1.5;
      if (b.userData.glow) {
        b.userData.glow.material.opacity = 0.3 + Math.sin(tGlobal * 3 + ph) * 0.15;
      }
      if (b.userData.mesh) {
        const s = 1 + Math.sin(tGlobal * 3 + ph) * 0.05;
        b.userData.mesh.scale.set(s, s, 1);
      }
    });

    [vrBraceletL, vrBraceletR].forEach((br, i) => {
      if (!br.userData) return;
      const glow = br.userData.glowRing;
      const btnTop = br.userData.btnTop;
      const ph = i * 2;
      if (glow) {
        glow.material.opacity = 0.6 + Math.sin(tGlobal * 3.5 + ph) * 0.4;
        glow.scale.setScalar(1 + Math.sin(tGlobal * 3.5 + ph) * 0.15);
      }
      if (btnTop) {
        btnTop.material.emissiveIntensity = 0.8 + Math.sin(tGlobal * 3.5 + ph) * 0.5;
      }
    });
  } else {
    vrUIGroup.visible = false;
  }

  // Holograma
  if (state.summoned) {
    state.holoTime += dt;
    const t = state.holoTime;
    const holo = state.summoned;
    if (!holo.userData.baseY) holo.userData.baseY = holo.position.y;
    holo.position.y = holo.userData.baseY + Math.sin(t * 1.2) * 0.02;

    const planes = holo.userData.holoPlanes;
    const yOff = holo.userData.y || 0.55;
    if (planes) {
      planes.forEach((p, i) => {
        p.lookAt(camera.position);
        if (i === 1) p.position.set(0.015 + Math.sin(t * 14) * 0.004, yOff, 0.01);
        else if (i === 2) p.position.set(-0.015 + Math.sin(t * 14 + 1.5) * 0.004, yOff, 0.01);
        else p.position.y = yOff;
      });
    }
    if (holo.userData.auraSprite) {
      const s = 1.4 + Math.sin(t * 1.8) * 0.15;
      holo.userData.auraSprite.scale.set(s, s, 1);
    }
    if (holo.userData.outerRing) holo.userData.outerRing.rotation.z = t * 0.4;
    if (holo.userData.runes) holo.userData.runes.rotation.y = t * 0.5;
    if (holo.userData.beam) holo.userData.beam.material.opacity = 0.18 + Math.sin(t * 3) * 0.06;
    if (holo.userData.gem) {
      holo.userData.gem.rotation.y = t * 1.5;
      holo.userData.gem.rotation.x = t * 0.9;
    }
    holo.traverse(o => {
      if (o.userData.isParticles) {
        const seeds = o.userData.seeds;
        const pos = o.geometry.attributes.position.array;
        for (let i = 0; i < seeds.length; i++) {
          const s = seeds[i];
          const a = s.a + t * s.speed;
          pos[i*3] = Math.cos(a) * s.r;
          pos[i*3+1] = s.y + Math.sin(t * 1.8 + s.phase) * 0.05;
          pos[i*3+2] = Math.sin(a) * s.r;
        }
        o.geometry.attributes.position.needsUpdate = true;
      }
    });
  }

  if (!renderer.xr.isPresenting && !state.vrPreview) controls.update();
  renderer.render(scene, camera);
});

setTimeout(() => {
  const l = document.getElementById('loading');
  l.classList.add('hide');
  setTimeout(() => l.remove(), 700);
}, 400);
</script>
