const SKY_RADIUS = 180;
function makeSkyTexture() {
  const cv = document.createElement('canvas');
  cv.width = 2048; cv.height = 1024;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, cv.height);
  g.addColorStop(0, '#0a1230'); g.addColorStop(0.45, '#040812');
  g.addColorStop(0.55, '#040812'); g.addColorStop(1, '#0a1230');
  ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let i = 0; i < 26; i++) {
    const x = Math.random() * cv.width;
    const y = Math.random() * cv.height;
    const r = 150 + Math.random() * 400;
    const hue = 200 + Math.random() * 100;
    const neb = ctx.createRadialGradient(x, y, 0, x, y, r);
    neb.addColorStop(0, `hsla(${hue}, 80%, 55%, 0.10)`);
    neb.addColorStop(0.5, `hsla(${hue}, 70%, 45%, 0.04)`);
    neb.addColorStop(1, 'transparent');
    ctx.fillStyle = neb;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 3500; i++) {
    const x = Math.random() * cv.width;
    const y = Math.random() * cv.height;
    const r = Math.random() * 1.6 + 0.2;
    const b = Math.random() * 0.7 + 0.2;
    const hue = Math.random() < 0.15 ? 200 + Math.random() * 60 : 40 + Math.random() * 20;
    ctx.fillStyle = `hsla(${hue}, 60%, ${70 + Math.random() * 25}%, ${b})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    if (r > 1.0) {
      ctx.fillStyle = `hsla(${hue}, 80%, 80%, ${b * 0.25})`;
      ctx.beginPath(); ctx.arc(x, y, r * 3.5, 0, 7); ctx.fill();
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function buildConstellation(pts, name, scale, color, intensity, isZodiac) {
  const group = new THREE.Group();
  const center = pts.reduce((a, p) => [a[0] + p[0], a[1] + p[1]], [0,0]);
  center[0] /= pts.length; center[1] /= pts.length;
  const localPts = pts.map(p => [(p[0] - center[0]) * 6 * scale, (p[1] - center[1]) * 6 * scale]);
  const linePts = localPts.map(p => new THREE.Vector3(p[0], p[1], 0));
  const lineMat = new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 0.45 * intensity,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false
  });
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(linePts), lineMat);
  group.add(line);
  group.userData.lineMat = lineMat;
  group.userData.baseLineOpacity = 0.45 * intensity;
  group.userData.phase = Math.random() * Math.PI * 2;

  localPts.forEach(p => {
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: STAR_GLOW_TEX, color: color, transparent: true,
      opacity: 0.55 * intensity, blending: THREE.AdditiveBlending,
      depthWrite: false, depthTest: false
    }));
    halo.scale.set(7, 7, 1);
    halo.position.set(p[0], p[1], -0.08);
    halo.userData.baseScale = 7;
    halo.userData.baseOpacity = 0.55 * intensity;
    halo.userData.pulseSpeed = 0.6 + Math.random() * 0.8;
    halo.userData.pulsePhase = Math.random() * Math.PI * 2;
    allPulsingStars.push(halo);
    group.add(halo);

    const mid = new THREE.Sprite(new THREE.SpriteMaterial({
      map: STAR_MID_TEX, color: color, transparent: true,
      opacity: 0.75 * intensity, blending: THREE.AdditiveBlending,
      depthWrite: false, depthTest: false
    }));
    mid.scale.set(3.6, 3.6, 1);
    mid.position.set(p[0], p[1], -0.03);
    mid.userData.baseScale = 3.6;
    mid.userData.baseOpacity = 0.75 * intensity;
    mid.userData.pulseSpeed = 0.8 + Math.random() * 0.9;
    mid.userData.pulsePhase = Math.random() * Math.PI * 2 + 1.3;
    allPulsingStars.push(mid);
    group.add(mid);

    const coreTex = isZodiac ? BRIGHT_STAR_TEX : STAR_CORE_TEX;
    const core = new THREE.Sprite(new THREE.SpriteMaterial({
      map: coreTex, color: isZodiac ? 0xffffff : color, transparent: true,
      opacity: 0.98 * intensity, blending: THREE.AdditiveBlending,
      depthWrite: false, depthTest: false
    }));
    const coreSize = isZodiac ? 3.5 : 2.0;
    core.scale.set(coreSize, coreSize, 1);
    core.position.set(p[0], p[1], 0);
    core.userData.baseScale = coreSize;
    core.userData.baseOpacity = 0.98 * intensity;
    core.userData.pulseSpeed = 1.0 + Math.random() * 1.0;
    core.userData.pulsePhase = Math.random() * Math.PI * 2 + 2.7;
    allPulsingStars.push(core);
    group.add(core);

    if (isZodiac) {
      const coreWhite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: BRIGHT_STAR_TEX, color: 0xfff5d0, transparent: true,
        opacity: 0.9, blending: THREE.AdditiveBlending,
        depthWrite: false, depthTest: false
      }));
      coreWhite.scale.set(2.5, 2.5, 1);
      coreWhite.position.set(p[0], p[1], 0.02);
      coreWhite.userData.baseScale = 2.5;
      coreWhite.userData.baseOpacity = 0.9;
      coreWhite.userData.pulseSpeed = 1.5 + Math.random() * 0.8;
      coreWhite.userData.pulsePhase = Math.random() * Math.PI * 2;
      allPulsingStars.push(coreWhite);
      group.add(coreWhite);
    }
  });
  group.userData.isZodiac = isZodiac;
  return group;
}
function placeConstellation(group, azimuth, elevation, dist = SKY_RADIUS * 0.75) {

    dist * Math.cos(elevation) * Math.sin(azimuth)
  );
  group.lookAt(0, 0, 0);
}

  const numPts = 4 + Math.floor(rnd(1) * 4);
  const pts = []; let cx = 0, cy = 0;
  for (let j = 0; j < numPts; j++) {
    cx += (rnd(j + 2) - 0.5) * 2.4;
    cy += (rnd(j + 9) - 0.5) * 2.4;
    pts.push([cx, cy]);

  );

    dist * Math.cos(dirEl) * Math.cos(dirAz),
    dist * Math.sin(dirEl),

  const sPos = new Float32Array(sparkCount * 3);

  const sMat = new THREE.PointsMaterial({
    color: color, size: 0.6, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false
  });
  const sparks = new THREE.Points(sGeo, sMat);
  group.add(sparks);

  scene.add(group);
  shootingStars.push({
    group, head, trailMesh, trailMat, headTex, sparks, sMat, sGeo, sparkCount,
    startPos, endPos, tailDir,

  });
}

function createCard(data, index) {

  });
  const edgeMat = new THREE.MeshStandardMaterial({ color: 0xf7f4ec, roughness: 0.5 });

function createSheet(yPos, frontCards, backCards) {
  const pivot = new THREE.Group();
  pivot.position.set(0, yPos, 0);
  bookGroup.add(pivot);
  const paperMat = new THREE.MeshStandardMaterial({ color: 0xf7f0dd, roughness: 0.92 });
  const edgeMat = new THREE.MeshStandardMaterial({ color: 0xe9dcc0, roughness: 0.88 });
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(PW, SHEET_T, PD),
    [edgeMat, edgeMat, paperMat, paperMat, edgeMat, edgeMat]
  );
  mesh.position.set(PW / 2, 0, 0);
  mesh.castShadow = true; mesh.receiveShadow = true;
  pivot.add(mesh);
  const cols = [-1.7, 0, 1.7], rows = [-1.6, 1.6];
  const positions = [];
  for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) positions.push({ x: cols[c], z: rows[r] });
  if (frontCards) frontCards.forEach((d, i) => {
    const card = createCard(d, i);
    card.position.set(positions[i].x, SHEET_T / 2 + CARD_T / 2, positions[i].z);
    mesh.add(card);
  });
  if (backCards) backCards.forEach((d, i) => {
    const card = createCard(d, i + 100);
    card.position.set(positions[i].x, -SHEET_T / 2 - CARD_T / 2, positions[i].z);
    card.rotation.z = Math.PI;
    mesh.add(card);
  });

   TWEEN
   ============================================================ */
const activeTweens = [];
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function animate(duration, updateFn, completeFn, ease = easeInOutCubic) {
  const t0 = performance.now();
  const tw = {
    update(now) {
      const p = Math.min(1, (now - t0) / duration);
      updateFn(ease(p), p);
      return p < 1;
    },
    complete: completeFn
  };
  activeTweens.push(tw);
  return tw;
}
function updateTweens(now) {
  for (let i = activeTweens.length - 1; i >= 0; i--) {
    const done = !activeTweens[i].update(now);
    if (done) {
      const cb = activeTweens[i].complete;
      activeTweens.splice(i, 1);
      if (cb) cb();
    }
  }
}

// ⬇️ AJUSTE AQUI: DIMINUIR O TAMANHO E AUMENTAR A DISTÂNCIA ⬇️
const BOOK_VR_SCALE = 0.026;    // era 0.045 → agora 42% menor
const BOOK_VR_Y = -0.14;        // altura (levemente mais alto, pois está mais longe)
const BOOK_VR_Z = -0.42;        // era -0.24 → agora 42cm à frente (75% mais longe)
const BOOK_VR_TILT = -0.32;     // inclinação sutil

const bookVR = {
  active: false,
  localPos: new THREE.Vector3(-COVER_W / 2 * BOOK_VR_SCALE, BOOK_VR_Y, BOOK_VR_Z),
  localQuat: new THREE.Quaternion().setFromEuler(new THREE.Euler(BOOK_VR_TILT, 0, 0)),
  scale: BOOK_VR_SCALE,
  targetPos: new THREE.Vector3(-COVER_W / 2 * BOOK_VR_SCALE, BOOK_VR_Y, BOOK_VR_Z),
  targetQuat: new THREE.Quaternion().setFromEuler(new THREE.Euler(BOOK_VR_TILT, 0, 0)),
  targetScale: BOOK_VR_SCALE
};

function refreshBookVRTarget() {
  const s = BOOK_VR_SCALE;
  if (state.mode === 'closed') {
    bookVR.targetPos.set(-COVER_W / 2 * s, BOOK_VR_Y, BOOK_VR_Z);
  } else {
    bookVR.targetPos.set(0, BOOK_VR_Y, BOOK_VR_Z);
  }
  bookVR.targetQuat.setFromEuler(new THREE.Euler(BOOK_VR_TILT, 0, 0));
  bookVR.targetScale = s;
}

function updateBookVRTransform(dt) {
  if (!bookVR.active) return;
  const k = 1 - Math.pow(0.0005, dt);
  bookVR.localPos.lerp(bookVR.targetPos, k);
  bookVR.localQuat.slerp(bookVR.targetQuat, k);
  bookVR.scale += (bookVR.targetScale - bookVR.scale) * k;

  const camPos = new THREE.Vector3();
  const camQuat = new THREE.Quaternion();
  camera.getWorldPosition(camPos);
  camera.getWorldQuaternion(camQuat);

  const worldOffset = bookVR.localPos.clone().applyQuaternion(camQuat);
  bookGroup.position.copy(camPos).add(worldOffset);
  bookGroup.quaternion.copy(camQuat).multiply(bookVR.localQuat);
  bookGroup.scale.setScalar(bookVR.scale);
}

function enableBookVR() {
  bookVR.active = true;
  // Começa distante/pequeno para animação de entrada
  bookVR.localPos.set(0, -1.0, -0.15);
  bookVR.localQuat.setFromEuler(new THREE.Euler(0.5, -0.6, 0));
  bookVR.scale = 0.001;
  refreshBookVRTarget();
}
function disableBookVR() {
  bookVR.active = false;
  bookGroup.position.set(0, 1.0, -1.5);
  bookGroup.rotation.set(0, 0, 0);
  bookGroup.scale.setScalar(1);
}

/* ============================================================
   ABRIR / FECHAR / FOLHEAR
   ============================================================ */
function isVRActive() { return renderer.xr.isPresenting || state.vrPreview; }

function openAlbum() {
  if (state.mode !== 'closed') return;
  state.mode = 'flipping'; state.spread = 1; refreshUI();
  if (isVRActive()) refreshBookVRTarget();
  const sR = coverInfo.pivot.rotation.z, sY = coverInfo.pivot.position.y;
  const camStart = camera.position.clone();
  const tgtStart = controls.target.clone();
  const inVR = isVRActive();
  animate(1200, (t) => {
    coverInfo.pivot.rotation.z = sR + (Math.PI - sR) * t;
    coverInfo.pivot.position.y = sY + (coverInfo.flippedY - sY) * t;
    if (!inVR) {
      camera.position.lerpVectors(camStart, CAM_OPEN, t);
      controls.target.lerpVectors(tgtStart, TARGET_OPEN, t);
      controls.update();
    }
  }, () => { state.mode = 'open'; refreshUI(); });
}
function closeAlbum() {
  if (state.mode !== 'open') return;
  if (state.spread > 1) { flipBack(() => closeAlbum()); return; }
  state.mode = 'flipping'; refreshUI();
  if (isVRActive()) refreshBookVRTarget();
  const sR = coverInfo.pivot.rotation.z, sY = coverInfo.pivot.position.y;
  const camStart = camera.position.clone();
  const tgtStart = controls.target.clone();
  const inVR = isVRActive();
  animate(1200, (t) => {
    coverInfo.pivot.rotation.z = sR * (1 - t);
    coverInfo.pivot.position.y = sY + (coverInfo.originalY - sY) * t;
    if (!inVR) {
      camera.position.lerpVectors(camStart, CAM_CLOSED, t);
      controls.target.lerpVectors(tgtStart, TARGET_CLOSED, t);
      controls.update();
    }
  }, () => { state.mode = 'closed'; state.spread = 0; refreshUI(); });
}
function flipForward() {
  if (state.mode !== 'open' || state.spread >= MAX_SPREAD) return;
  state.mode = 'flipping'; refreshUI();
  let target = state.spread === 1 ? sheet1 : state.spread === 2 ? sheet2 : null;
  if (!target) return;
  const sR = target.pivot.rotation.z, sY = target.pivot.position.y;
  animate(950, (t) => {
    target.pivot.rotation.z = sR + (Math.PI - sR) * t;
    target.pivot.position.y = sY + (target.flippedY - sY) * t;
    target.pivot.position.y += Math.sin(t * Math.PI) * 0.06;
  }, () => {
    target.pivot.rotation.z = Math.PI;
    target.pivot.position.y = target.flippedY;
    state.spread++; state.mode = 'open'; refreshUI();
  });
}
function flipBack(callback) {
  if (state.mode !== 'open' || state.spread <= 1) { if (callback) callback(); return; }
  state.mode = 'flipping'; refreshUI();
  let target = state.spread === 2 ? sheet1 : state.spread === 3 ? sheet2 : null;
  if (!target) { state.mode = 'open'; refreshUI(); return; }
  const sR = target.pivot.rotation.z, sY = target.pivot.position.y;
  animate(950, (t) => {
    target.pivot.rotation.z = sR * (1 - t);
    target.pivot.position.y = sY + (target.originalY - sY) * t;
    target.pivot.position.y += Math.sin(t * Math.PI) * 0.06;
  }, () => {
    target.pivot.rotation.z = 0;
    target.pivot.position.y = target.originalY;
    state.spread--; state.mode = 'open'; refreshUI();
    if (callback) callback();
  });
}

/* RAYCAST */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
function setPointer(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}
function pickCard() {
  raycaster.setFromCamera(pointer, camera);
  const allCards = [];
  bookGroup.traverse(o => { if (o.userData.isCard) allCards.push(o); });
  const hits = raycaster.intersectObjects(allCards, false);
  return hits.length ? hits[0].object : null;
}
function pickCover() {
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObject(coverOutsidePlane, false).length > 0;
}
function computeCardFacingQuat(cardPos, camPos) {
  const yDir = new THREE.Vector3().subVectors(camPos, cardPos).normalize();
  const worldDown = new THREE.Vector3(0, -1, 0);
  const zDir = worldDown.clone().projectOnPlane(yDir).normalize();
  const xDir = new THREE.Vector3().crossVectors(yDir, zDir).normalize();
  return new THREE.Quaternion().setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(xDir, yDir, zDir)
  );
}

/* INVOCAR / DESINVOCAR */
function summonHologram(card) {
  const data = card.userData.cardData;
  const cardWorldPos = new THREE.Vector3();
  card.getWorldPosition(cardWorldPos);
  const holo = buildHologram(data);
  holo.position.copy(cardWorldPos).add(new THREE.Vector3(0, 2.1, 0));
  holo.scale.setScalar(0.01);
  scene.add(holo);
  state.summoned = holo;
  state.holoTime = 0;
  const inVR = isVRActive();
  const targetScale = inVR ? 0.22 : 0.9;
  animate(750, (t) => { holo.scale.setScalar(0.01 + t * targetScale); },
    () => { holo.scale.setScalar(targetScale); }, easeOutCubic);
}
function desummonHologram(onComplete) {
  if (!state.summoned) { if (onComplete) onComplete(); return; }
  const holo = state.summoned;
  state.summoned = null;
  const bc = 70;
  const bGeo = new THREE.BufferGeometry();
  const pos = new Float32Array(bc * 3);
  const col = new Float32Array(bc * 3);
  const vel = [];
  const c = new THREE.Color(0x88ddff);
  for (let i = 0; i < bc; i++) {
    pos[i*3] = holo.position.x;
    pos[i*3+1] = holo.position.y + 1.7;
    pos[i*3+2] = holo.position.z;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const s = 1.0 + Math.random() * 2.5;
    vel.push({
      x: Math.sin(phi) * Math.cos(theta) * s,
      y: Math.cos(phi) * s + 0.6,
      z: Math.sin(phi) * Math.sin(theta) * s
    });
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  bGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  bGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const bMat = new THREE.PointsMaterial({
    size: 0.15, vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const burst = new THREE.Points(bGeo, bMat);
  scene.add(burst);
  const sScale = holo.scale.x;
  animate(500, (t) => {
    holo.scale.setScalar(sScale * (1 - t));
    const p = burst.geometry.attributes.position.array;
    for (let i = 0; i < bc; i++) {
      p[i*3] += vel[i].x * 0.016;
      p[i*3+1] += vel[i].y * 0.016;
      p[i*3+2] += vel[i].z * 0.016;
      vel[i].y -= 0.04;
    }
    burst.geometry.attributes.position.needsUpdate = true;
    bMat.opacity = 1 - t;
  }, () => {
    scene.remove(holo);
    holo.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    });
    animate(400, (t) => {
      bMat.opacity = 1 - t;
      bMat.size = 0.15 * (1 + t * 2);
    }, () => {
      scene.remove(burst);
      bGeo.dispose(); bMat.dispose();
      if (onComplete) onComplete();
    });
  });
}

/* INSPECIONAR */
function inspectCard(card) {
  if (state.summoned) { desummonHologram(() => doInspect(card)); return; }
  doInspect(card);
}
function doInspect(card) {
  state.mode = 'inspecting';
  state.inspectedCard = card;
  state.cardOriginalParent = card.parent;
  state.cardOriginalPos = card.position.clone();
  state.cardOriginalQuat = card.quaternion.clone();
  state.cardOriginalScale = card.scale.clone();
  scene.attach(card);
  const camPos = new THREE.Vector3();
  camera.getWorldPosition(camPos);
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  const inVR = isVRActive();
  const dist = inVR ? 0.32 : 6.8;
  const targetPos = camPos.clone().addScaledVector(camDir, dist);
  const targetQuat = computeCardFacingQuat(targetPos, camPos);
  const startPos = card.position.clone();
  const startQuat = card.quaternion.clone();
  const startScale = card.scale.clone();
  const targetScale = inVR
    ? new THREE.Vector3(0.05, 0.05, 0.05)
    : new THREE.Vector3(1.3, 1.3, 1.3);
  controls.enabled = false;
  refreshUI();
  animate(600, (t) => {
    card.position.lerpVectors(startPos, targetPos, t);
    card.quaternion.slerpQuaternions(startQuat, targetQuat, t);
    card.scale.lerpVectors(startScale, targetScale, t);
  }, () => {
    card.position.copy(targetPos);
    card.quaternion.copy(targetQuat);
    card.scale.copy(targetScale);
    summonHologram(card);
    refreshUI();
  }, easeOutCubic);
}

/* DEVOLVER */
function returnInspectedCard() {
  if (!state.inspectedCard) return;
  const card = state.inspectedCard;
  if (state.summoned) desummonHologram(() => returnCardToAlbum(card));
  else returnCardToAlbum(card);
}
function returnCardToAlbum(card) {
  const parent = state.cardOriginalParent;
  parent.updateWorldMatrix(true, false);
  const targetWorldPos = state.cardOriginalPos.clone().applyMatrix4(parent.matrixWorld);
  const parentWorldQuat = new THREE.Quaternion();
  parent.getWorldQuaternion(parentWorldQuat);
  const targetWorldQuat = parentWorldQuat.clone().multiply(state.cardOriginalQuat);
  const startPos = card.position.clone();
  const startQuat = card.quaternion.clone();
  const startScale = card.scale.clone();
  const targetScale = state.cardOriginalScale.clone();
  state.mode = 'flipping';
  state.inspectedCard = null;
  refreshUI();
  animate(550, (t) => {
    card.position.lerpVectors(startPos, targetWorldPos, t);
    card.quaternion.slerpQuaternions(startQuat, targetWorldQuat, t);
    card.scale.lerpVectors(startScale, targetScale, t);
  }, () => {
    parent.add(card);
    card.position.copy(state.cardOriginalPos);
    card.quaternion.copy(state.cardOriginalQuat);
    card.scale.copy(state.cardOriginalScale);
    state.mode = 'open';
    controls.enabled = true;
    refreshUI();
  });
}

/* DRAG */
let pointerDownOnCard = false;
let pointerDownPos = new THREE.Vector2();
let pointerDownTime = 0;
let dragPlane = new THREE.Plane();
let dragOffset = new THREE.Vector3();
let didDrag = false;
const DRAG_THRESHOLD_PX = 6;
function startCardDrag(e, card) {
  pointerDownOnCard = true;
  pointerDownPos.set(e.clientX, e.clientY);
  pointerDownTime = performance.now();
  didDrag = false;
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  const cardPos = new THREE.Vector3();
  card.getWorldPosition(cardPos);
  dragPlane.setFromNormalAndCoplanarPoint(camDir, cardPos);
  raycaster.setFromCamera(pointer, camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(dragPlane, hit)) dragOffset.copy(cardPos).sub(hit);
}
function updateCardDrag(e) {
  if (!pointerDownOnCard || !state.inspectedCard) return;
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  if (!didDrag && dx*dx + dy*dy > DRAG_THRESHOLD_PX * DRAG_THRESHOLD_PX) {
    didDrag = true;
    renderer.domElement.style.cursor = 'grabbing';
  }
  if (!didDrag) return;
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(dragPlane, hit)) {
    const newPos = hit.clone().add(dragOffset);
    state.inspectedCard.position.copy(newPos);
    if (state.summoned) state.summoned.position.copy(newPos).add(new THREE.Vector3(0, 2.1, 0));
  }
}
function endCardDrag(e) {
  if (!pointerDownOnCard) return;
  const wasClick = !didDrag && (performance.now() - pointerDownTime) < 500;
  pointerDownOnCard = false;
  if (wasClick && state.inspectedCard) { returnInspectedCard(); return; }
  if (didDrag) renderer.domElement.style.cursor = 'pointer';
}

/* EVENTOS */
function onPointerDown(e) {
  if (e.button !== 0 || renderer.xr.isPresenting) return;
  setPointer(e);
  if (state.mode === 'closed') { if (pickCover()) openAlbum(); return; }
  if (state.mode === 'open') {
    const card = pickCard();
    if (card) inspectCard(card);
    return;
  }
  if (state.mode === 'inspecting') {
    raycaster.setFromCamera(pointer, camera);
    if (raycaster.intersectObject(state.inspectedCard, false).length > 0) {
      startCardDrag(e, state.inspectedCard);
    } else returnInspectedCard();
  }
}
function onPointerMove(e) {
  if (renderer.xr.isPresenting) return;
  if (state.mode === 'inspecting' && pointerDownOnCard) { updateCardDrag(e); return; }
  if (state.mode === 'closed') {
    setPointer(e);
    renderer.domElement.style.cursor = pickCover() ? 'pointer' : 'grab';
  } else if (state.mode === 'open') {
    setPointer(e);
    renderer.domElement.style.cursor = pickCard() ? 'pointer' : 'grab';
  } else if (state.mode === 'inspecting') {
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    renderer.domElement.style.cursor =
      raycaster.intersectObject(state.inspectedCard, false).length > 0 ? 'grab' : 'default';
  }
}
function onPointerUp(e) { if (pointerDownOnCard) endCardDrag(e); }

renderer.domElement.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.mode === 'inspecting') returnInspectedCard();
    else if (state.mode === 'open') closeAlbum();
  }
  if (e.key === 'ArrowRight' && state.mode === 'open') flipForward();
  if (e.key === 'ArrowLeft' && state.mode === 'open') flipBack();
  if ((e.key === 'd' || e.key === 'D') && state.summoned) desummonHologram();
});
openBtn.addEventListener('click', (e) => { e.stopPropagation(); openAlbum(); });
closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeAlbum(); });
nextBtn.addEventListener('click', (e) => { e.stopPropagation(); flipForward(); });
prevBtn.addEventListener('click', (e) => { e.stopPropagation(); flipBack(); });
backBtn.addEventListener('click', (e) => { e.stopPropagation(); returnInspectedCard(); });
desummonBtn.addEventListener('click', (e) => { e.stopPropagation(); desummonHologram(); });

/* ============================================================
   PREVIEW VR
   ============================================================ */
let savedCameraPos = new THREE.Vector3();
let savedCameraQuat = new THREE.Quaternion();
let savedTarget = new THREE.Vector3();
let savedControlsEnabled = true;

function enterVRPreview() {
  if (state.vrPreview || renderer.xr.isPresenting) return;
  state.vrPreview = true;
  savedCameraPos.copy(camera.position);
  savedCameraQuat.copy(camera.quaternion);
  savedTarget.copy(controls.target);
  savedControlsEnabled = controls.enabled;
  camera.position.set(0, 1.65, 0);
  camera.quaternion.setFromEuler(new THREE.Euler(-0.22, 0, 0));
  controls.enabled = false;
  enableBookVR();
  extendedGroup.visible = true;
  zodiacGroup.visible = true;
  vrPreviewOverlay.classList.add('active');
  vrExit.classList.add('active');
  refreshUI();
}
function exitVRPreview() {
  if (!state.vrPreview) return;
  state.vrPreview = false;
  vrPreviewOverlay.classList.remove('active');
  vrExit.classList.remove('active');
  disableBookVR();
  camera.position.copy(savedCameraPos);
  camera.quaternion.copy(savedCameraQuat);
  controls.target.copy(savedTarget);
  controls.enabled = savedControlsEnabled;
  controls.update();
  extendedGroup.visible = false;
  state.mode = 'closed';
  state.spread = 0;
  coverInfo.pivot.rotation.z = 0;
  coverInfo.pivot.position.y = coverInfo.originalY;
  sheet1.pivot.rotation.z = 0; sheet1.pivot.position.y = sheet1.originalY;
  sheet2.pivot.rotation.z = 0; sheet2.pivot.position.y = sheet2.originalY;
  refreshUI();
}
previewBtn.addEventListener('click', (e) => { e.stopPropagation(); enterVRPreview(); });
vrExit.addEventListener('click', (e) => { e.stopPropagation(); exitVRPreview(); });

/* ============================================================
   VR
   ============================================================ */
const controller0 = renderer.xr.getController(0);
const controller1 = renderer.xr.getController(1);
const controllerModelFactory = new XRControllerModelFactory();
const grip0 = renderer.xr.getControllerGrip(0);
const grip1 = renderer.xr.getControllerGrip(1);
grip0.add(controllerModelFactory.createControllerModel(grip0));
grip1.add(controllerModelFactory.createControllerModel(grip1));
function addRay(controller) {
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -4)
  ]);
  controller.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0xd4af5a, transparent: true, opacity: 0.6
  })));
}
addRay(controller0); addRay(controller1);
scene.add(controller0); scene.add(controller1);
scene.add(grip0); scene.add(grip1);

function onControllerSelect(event) {
  const controller = event.target;
  const tempMatrix = new THREE.Matrix4();
  tempMatrix.identity().extractRotation(controller.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
  if (state.mode === 'closed') {
    if (raycaster.intersectObject(coverOutsidePlane, false).length > 0) openAlbum();
    return;
  }
  if (state.mode === 'open') {
    const allCards = [];
    bookGroup.traverse(o => { if (o.userData.isCard) allCards.push(o); });
    const hits = raycaster.intersectObjects(allCards, false);
    if (hits.length > 0) inspectCard(hits[0].object);
    return;
  }
  if (state.mode === 'inspecting') {
    if (raycaster.intersectObject(state.inspectedCard, false).length === 0) returnInspectedCard();
  }
}
controller0.addEventListener('selectstart', onControllerSelect);
controller1.addEventListener('selectstart', onControllerSelect);

/* ============================================================
   SESSÃO VR
   ============================================================ */
renderer.xr.addEventListener('sessionstart', () => {
  extendedGroup.visible = true;
  zodiacGroup.visible = true;
  enableBookVR();
  refreshUI();
});
renderer.xr.addEventListener('sessionend', () => {
  extendedGroup.visible = false;
  disableBookVR();
  state.mode = 'closed';
  state.spread = 0;
  coverInfo.pivot.rotation.z = 0;
  coverInfo.pivot.position.y = coverInfo.originalY;
  sheet1.pivot.rotation.z = 0; sheet1.pivot.position.y = sheet1.originalY;
  sheet2.pivot.rotation.z = 0; sheet2.pivot.position.y = sheet2.originalY;
  camera.position.copy(CAM_CLOSED);
  controls.target.copy(TARGET_CLOSED);
  controls.enabled = true;
  controls.update();
  refreshUI();
});

/* ============================================================
   RESIZE + LOOP
   ============================================================ */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
window.addEventListener('resize', onResize);
refreshUI();
let lastTime = performance.now();

renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  updateTweens(now);
  updateBookVRTransform(dt);

  skyMesh.rotation.y += dt * 0.003;
  const tGlobal = now * 0.001;

  for (let i = 0; i < allPulsingStars.length; i++) {
    const s = allPulsingStars[i];
    const base = s.userData.baseScale;
    const speed = s.userData.pulseSpeed;
    const phase = s.userData.pulsePhase;
    const pulse = 1 + Math.sin(tGlobal * speed + phase) * 0.22;
    s.scale.set(base * pulse, base * pulse, 1);
    s.material.opacity = s.userData.baseOpacity * (0.65 + Math.sin(tGlobal * speed * 1.3 + phase) * 0.35);
  }

  [zodiacGroup, extendedGroup].forEach(grp => {
    if (!grp.visible) return;
    grp.children.forEach((c) => {
      if (c.userData.lineMat) {
        c.userData.lineMat.opacity = c.userData.baseLineOpacity *
          (0.7 + Math.sin(tGlobal * 1.4 + c.userData.phase) * 0.3);
      }
    });
  });

  nebulaGroup.children.forEach(n => {
    const base = n.userData.baseOpacity;
    const sp = n.userData.pulseSpeed;
    const ph = n.userData.pulsePhase;
    n.material.opacity = base * (0.75 + Math.sin(tGlobal * sp + ph) * 0.25);
  });

  shootingStarTimer += dt;
  if (shootingStarTimer > shootingStarInterval) {
    shootingStarTimer = 0;
    spawnShootingStar();
  }
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const ss = shootingStars[i];
    ss.t += dt / ss.life;
    if (ss.t >= 1) {
      scene.remove(ss.group);
      ss.group.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
          else o.material.dispose();
        }
      });
      if (ss.headTex) ss.headTex.dispose();
      shootingStars.splice(i, 1);
      continue;
    }
    const p = ss.t;
    const pos = new THREE.Vector3().lerpVectors(ss.startPos, ss.endPos, p);
    ss.group.position.copy(pos);
    const dir = ss.tailDir;
    const up = new THREE.Vector3(0, 1, 0);
    if (Math.abs(dir.y) > 0.95) up.set(1, 0, 0);
    const right = new THREE.Vector3().crossVectors(dir, up).normalize();
    const realUp = new THREE.Vector3().crossVectors(right, dir).normalize();
    ss.group.quaternion.setFromRotationMatrix(
      new THREE.Matrix4().makeBasis(dir, realUp, right)
    );
    const fade = 1 - Math.max(0, p - 0.75) / 0.25;
    ss.head.material.opacity = fade;
    ss.trailMat.opacity = 0.95 * fade;
    ss.sMat.opacity = 0.85 * fade;
    if (ss.sparks) {
      const arr = ss.sparks.geometry.attributes.position.array;
      for (let j = 0; j < ss.sparkCount; j++) {
        arr[j*3+1] += Math.sin(tGlobal * 12 + j * 0.7) * 0.02;
        arr[j*3+2] += Math.cos(tGlobal * 12 + j * 1.3) * 0.02;
      }
      ss.sparks.geometry.attributes.position.needsUpdate = true;
    }
  }

  if (state.summoned) {
    state.holoTime += dt;
    const t = state.holoTime;
    const holo = state.summoned;
    if (!holo.userData.baseY) holo.userData.baseY = holo.position.y;
    holo.position.y = holo.userData.baseY + Math.sin(t * 1.2) * 0.14;

    const planes = holo.userData.holoPlanes;
    const yOff = holo.userData.y || 1.75;
    if (planes) {
      planes.forEach((p, i) => {
        p.lookAt(camera.position);
        if (i === 3) p.position.set(0.07 + Math.sin(t * 14) * 0.010, yOff, 0.03);
        else if (i === 4) p.position.set(-0.07 + Math.sin(t * 14 + 1.5) * 0.010, yOff, 0.03);
        else p.position.y = yOff;
      });
    }
    if (holo.userData.auraSprite) {
      const s = 6 + Math.sin(t * 1.8) * 0.4;
      holo.userData.auraSprite.scale.set(s, s, 1);
      holo.userData.auraSprite.material.opacity = 0.85 + Math.sin(t * 2.4) * 0.08;
    }
    if (holo.userData.scanTex) holo.userData.scanTex.offset.y = -t * 0.35;
    if (holo.userData.outerRing) holo.userData.outerRing.rotation.z = t * 0.4;
    if (holo.userData.midRing) holo.userData.midRing.rotation.z = -t * 0.7;
    if (holo.userData.runes) holo.userData.runes.rotation.y = t * 0.5;
    if (holo.userData.hex) holo.userData.hex.rotation.y = -t * 0.3;
    if (holo.userData.beam) holo.userData.beam.material.opacity = 0.18 + Math.sin(t * 3) * 0.06;
    if (holo.userData.gem) {
      holo.userData.gem.rotation.y = t * 1.5;
      holo.userData.gem.rotation.x = t * 0.9;
    }
    if (holo.userData.gemGlow) {
      const s = 1.8 + Math.sin(t * 4) * 0.35;
      holo.userData.gemGlow.scale.set(s, s, 1);
    }
    holo.traverse(o => {
      if (o.userData.isParticles) {
        const seeds = o.userData.seeds;
        const pos = o.geometry.attributes.position.array;
        for (let i = 0; i < seeds.length; i++) {
          const s = seeds[i];
          const a = s.a + t * s.speed;
          pos[i*3] = Math.cos(a) * s.r;
          pos[i*3+1] = s.y + Math.sin(t * 1.8 + s.phase) * 0.20;
          pos[i*3+2] = Math.sin(a) * s.r;
        }
        o.geometry.attributes.position.needsUpdate = true;
      }
    });
  }

  if (!renderer.xr.isPresenting && !state.vrPreview) controls.update();
  renderer.render(scene, camera);
});

setTimeout(() => {
  const l = document.getElementById('loading');
  l.classList.add('hide');
  setTimeout(() => l.remove(), 700);
}, 400);
</script>
